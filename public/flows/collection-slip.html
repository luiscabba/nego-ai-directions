<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 Collection Slip · Nego AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#C8321F}a:hover{color:#9E2617}
@keyframes enter{from{opacity:0;transform:translateY(30px) rotate(-1deg)}to{opacity:1;transform:none}}
@keyframes print{from{opacity:0;transform:translateY(-14px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes tick{0%{transform:scale(2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes type{from{width:0}to{width:11ch}}
@keyframes caret{50%{border-color:transparent}}
.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1) both}
.print{animation:print .45s ease-out both}
.stamp{animation:stamp .45s cubic-bezier(.2,.9,.3,1) both}
.tick{animation:tick .3s ease-out both}
.type{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;border-right:2px solid #1B1D1C;animation:type 1.6s steps(11) both, caret .7s step-end infinite}
@media (prefers-reduced-motion:reduce){.enter,.print,.stamp,.tick,.type{animation:none}.type{width:11ch}}
</style>
<style>
.dc-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(15,18,20,.82);backdrop-filter:blur(12px);font:600 12px/1 system-ui,sans-serif}
.dc-switch a{color:#E8ECEA;text-decoration:none;padding:8px 12px;border-radius:99px}
.dc-switch a:hover{background:rgba(255,255,255,.12)}
.dc-switch a[aria-current]{background:#E8ECEA;color:#111}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><div style="min-height: 900px; background: #C7CDC6; font-family: 'DM Mono', ui-monospace, monospace; color: #1B1D1C; display: flex; flex-direction: column">
  <header style="padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1B1D1C; background: #EEF0EC">
    <button onClick="{{goHome}}" style="border: 0; background: transparent; font-family: Anton, sans-serif; font-size: 26px; letter-spacing: 0.02em; color: #1B1D1C; cursor: pointer; padding: 0">NEGO AI</button>
    <span style="font-size: 13px">R. MANALO · MC 07 · {{stage}}</span>
  </header>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px; padding: 48px 60px; align-items: start">
      <div style="grid-column: span 7; position: relative; min-height: 600px">
        <div aria-hidden="true" style="position: absolute; left: 30px; top: 26px; width: 92%; height: 540px; background: #E3E6E1; transform: rotate(3deg); box-shadow: 0 2px 0 #A9B0A8"></div>
        <div aria-hidden="true" style="position: absolute; left: 12px; top: 12px; width: 94%; height: 550px; background: #E8EBE6; transform: rotate(-2deg); box-shadow: 0 2px 0 #A9B0A8"></div>
        <section class="enter" style="position: relative; background: #F6F7F4; padding: 36px 40px; box-shadow: 0 18px 30px rgba(30,40,30,0.18); border-top: 3px dashed #9AA19A; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px">CALL SLIP NO. 0412</span><span style="font-size: 13px; color: #C8321F">P1 · COACHING TICKET</span></div>
          <h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 64px; line-height: 0.95; text-transform: uppercase; letter-spacing: 0.01em">Affordable<br>Partial Payment</h1>
          <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
            <div style="display: flex; gap: 8px; font-size: 15px"><span>{{f.k}}</span><span style="flex: 1; border-bottom: 2px dotted #9AA19A; transform: translateY(-5px)"></span><span style="font-weight: 500">{{f.v}}</span></div>
          </sc-for>
          <button onClick="{{goLobby}}" style="margin-top: 10px; align-self: flex-start; padding: 16px 26px; border: 2px solid #1B1D1C; background: #1B1D1C; color: #F6F7F4; font-family: Anton, sans-serif; font-size: 20px; letter-spacing: 0.04em; cursor: pointer">TEAR OFF AND START</button>
        </section>
      </div>
      <aside style="grid-column: span 5; background: #F6F7F4; padding: 26px 28px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 20px rgba(30,40,30,0.12)">
        <span style="font-family: Anton, sans-serif; font-size: 22px; letter-spacing: 0.02em; padding-bottom: 10px">ON THE SPIKE</span>
        <sc-for list="{{spike}}" as="s" hint-placeholder-count="4"><div style="display: grid; grid-template-columns: 60px 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid #D5D9D3; font-size: 14px"><span style="color: #5E625F">{{s.no}}</span><span>{{s.t}}</span><span style="color: #5E625F">{{s.b}}</span></div></sc-for>
      </aside>
    </div>
  </sc-if>

  <sc-if value="{{isLobby}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px">
      <section class="enter" style="position: relative; width: 640px; background: #F6F7F4; padding: 40px 44px; box-shadow: 0 18px 30px rgba(30,40,30,0.18); border-top: 3px dashed #9AA19A; display: flex; flex-direction: column; gap: 18px">
        <span style="font-size: 13px">CALL SLIP NO. 0412 · PAIRING</span>
        <div style="display: flex; gap: 8px; font-size: 18px"><span>AGENT</span><span style="flex: 1; border-bottom: 2px dotted #9AA19A; transform: translateY(-6px)"></span><span>R. MANALO</span></div>
        <div style="display: flex; gap: 8px; font-size: 18px"><span>DEBTOR ROLE</span><span style="flex: 1; border-bottom: 2px dotted #9AA19A; transform: translateY(-6px)"></span><span class="type">J. DIZON</span></div>
        <div style="display: flex; gap: 8px; font-size: 18px"><span>RECORDING</span><span style="flex: 1; border-bottom: 2px dotted #9AA19A; transform: translateY(-6px)"></span><span>{{recText}}</span></div>
        <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
          <div class="stamp" style="position: absolute; right: 40px; top: 30px; padding: 8px 16px; border: 4px solid #C8321F; color: #C8321F; font-family: Anton, sans-serif; font-size: 36px; letter-spacing: 0.06em; opacity: 0.88">PAIRED</div>
          <button onClick="{{goLive}}" style="margin-top: 8px; align-self: flex-start; padding: 16px 26px; border: 2px solid #1B1D1C; background: #1B1D1C; color: #F6F7F4; font-family: Anton, sans-serif; font-size: 20px; letter-spacing: 0.04em; cursor: pointer">DIAL</button>
        </sc-if>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 36px; padding: 36px 60px">
      <section class="enter" style="grid-column: span 7; background: #F6F7F4; padding: 32px 36px; box-shadow: 0 18px 30px rgba(30,40,30,0.18); display: flex; flex-direction: column; gap: 22px; align-self: start">
        <div style="display: flex; justify-content: space-between; align-items: flex-end"><span style="font-family: Anton, sans-serif; font-size: 22px">REQUIRED</span><span style="font-family: Anton, sans-serif; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums">{{clock}}</span></div>
        <sc-for list="{{pts}}" as="p" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 30px 1fr 60px; gap: 14px; align-items: center; font-size: 16px">
            <div style="width: 24px; height: 24px; border: 2px solid #1B1D1C; display: flex; align-items: center; justify-content: center"><sc-if value="{{p.met}}" hint-placeholder-val="{{ false }}"><span class="tick" style="color: #C8321F; font-family: Anton, sans-serif; font-size: 22px; line-height: 1">✓</span></sc-if></div>
            <span style="text-decoration: {{p.dec}}; font-weight: {{p.fw}}">{{p.t}}</span>
            <span style="color: #5E625F; font-size: 13px; text-align: right">{{p.time}}</span>
          </div>
        </sc-for>
        <div style="border: 2px solid #1B1D1C; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; color: #C8321F">SAY · {{nowLabel}}</span><span style="font-size: 19px; line-height: 1.5"><span style="font-weight: 500">{{said}}</span> <span style="color: #8C918C">{{rest}}</span></span></div>
      </section>
      <section style="grid-column: span 5; display: flex; justify-content: center">
        <div style="width: 360px; background: #FFFFFF; padding: 22px 24px 30px; box-shadow: 0 14px 24px rgba(30,40,30,0.16); display: flex; flex-direction: column; gap: 14px; align-self: start; clip-path: polygon(0 0, 100% 0, 100% 100%, 95% 98%, 90% 100%, 85% 98%, 80% 100%, 75% 98%, 70% 100%, 65% 98%, 60% 100%, 55% 98%, 50% 100%, 45% 98%, 40% 100%, 35% 98%, 30% 100%, 25% 98%, 20% 100%, 15% 98%, 10% 100%, 5% 98%, 0 100%)">
          <span style="text-align: center; font-size: 12px; letter-spacing: 0.1em">TRANSCRIPT · LIVE</span>
          <span style="text-align: center; font-size: 12px; color: #8C918C">- - - - - - - - - - - - - - -</span>
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="5"><div class="print" style="display: flex; flex-direction: column; gap: 2px; font-size: 13px"><span style="color: {{l.c}}">{{l.ts}} {{l.who}}</span><span style="line-height: 1.5">{{l.text}}</span></div></sc-for>
        </div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{isResults}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 40px">
      <section class="enter" style="position: relative; width: 760px; background: #F6F7F4; padding: 40px 48px; box-shadow: 0 18px 30px rgba(30,40,30,0.18); display: flex; flex-direction: column; gap: 16px">
        <span style="font-size: 13px">SCORE SHEET · SLIP 0412 · 19 OCT 2026</span>
        <h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 48px; line-height: 1; text-transform: uppercase">Affordable Partial Payment</h1>
        <sc-for list="{{crit}}" as="c" hint-placeholder-count="3"><div class="print" style="display: flex; gap: 8px; font-size: 17px; animation-delay: {{c.d}}"><span>{{c.t}}</span><span style="flex: 1; border-bottom: 2px dotted #9AA19A; transform: translateY(-6px)"></span><span>{{c.v}}</span></div></sc-for>
        <div style="display: flex; gap: 8px; align-items: baseline; padding-top: 10px; border-top: 2px solid #1B1D1C"><span style="font-family: Anton, sans-serif; font-size: 24px">TOTAL</span><span style="flex: 1"></span><span style="font-family: Anton, sans-serif; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums">{{score}}</span><span style="font-size: 16px">/ 100</span></div>
        <span style="font-size: 15px; line-height: 1.5">NOTE: Offer the split sooner. Hardship came up at 01:36.</span>
        <sc-if value="{{done}}" hint-placeholder-val="{{ true }}"><div class="stamp" style="position: absolute; right: 50px; top: 90px; padding: 10px 20px; border: 5px solid #C8321F; color: #C8321F; font-family: Anton, sans-serif; font-size: 52px; letter-spacing: 0.06em; opacity: 0.88">PASSED</div></sc-if>
        <div style="display: flex; gap: 12px; padding-top: 6px"><button onClick="{{goHome}}" style="padding: 14px 22px; border: 2px solid #1B1D1C; background: #1B1D1C; color: #F6F7F4; font-family: Anton, sans-serif; font-size: 18px; letter-spacing: 0.04em; cursor: pointer">FILE IT</button><button onClick="{{goLive}}" style="padding: 14px 22px; border: 2px solid #1B1D1C; background: transparent; font-family: Anton, sans-serif; font-size: 18px; letter-spacing: 0.04em; cursor: pointer">REDIAL</button></div>
      </section>
    </div>
  </sc-if>
</div></template>
<script id="logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.POINTS = [
      { t: 'Verify identity', at: 2 }, { t: 'Confirm PTP date and amount', at: 5 }, { t: 'Probe ability to pay', at: 10 },
      { t: 'Offer partial if needed', at: 14 }, { t: 'Recap and close', at: 18 }
    ];
    this.LINES = [
      { at: 0, who: 'a', text: 'Magandang hapon po, si Rica po ito ng Amihan Bank. Si Mr. Jomar Dizon po ba ito?' },
      { at: 2, who: 'd', text: 'Oo, ako nga. Ano yun?' },
      { at: 3, who: 'a', text: 'I-confirm ko lang po ang ₱12,000 natin sa 25 Oct.' },
      { at: 6, who: 'd', text: 'Medyo mahirap ngayon. Nawalan ako ng sideline.' },
      { at: 8, who: 'a', text: 'Naiintindihan ko po. Ano po ang pinagkukunan natin ng pambayad ngayong buwan?' },
      { at: 11, who: 'd', text: 'Baka kalahati lang kaya ko sa 25.' },
      { at: 12, who: 'a', text: 'Pwede po nating hatiin: ₱6,000 sa 25 Oct at ₱6,000 sa 8 Nov.' },
      { at: 15, who: 'd', text: 'Sige, kaya ko yun.' },
      { at: 16, who: 'a', text: 'Recap po: ₱6,000 sa 25 Oct, ₱6,000 sa 8 Nov. Salamat po, Mr. Dizon.' }
    ];
    this.state = { screen: 'home', tick: 0, ready: false, score: 0 };
  }
  componentWillUnmount() { this.stop(); }
  stop() { if (this.iv) { clearInterval(this.iv); this.iv = null; } if (this.to) { clearTimeout(this.to); this.to = null; } }
  go(screen) {
    this.stop();
    this.setState({ screen, tick: 0, ready: false, score: 0 });
    if (screen === 'lobby') this.to = setTimeout(() => this.setState({ ready: true }), 2000);
    if (screen === 'live') this.iv = setInterval(() => { const t = this.state.tick + 1; if (t > 20) { this.go('results'); return; } this.setState({ tick: t }); }, 750);
    if (screen === 'results') this.iv = setInterval(() => { const s = Math.min(84, this.state.score + 2); this.setState({ score: s }); if (s >= 84) this.stop(); }, 25);
  }
  renderVals() {
    const s = this.state, t = s.tick;
    const fmt = x => String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
    const pts = this.POINTS.map((p, i) => {
      const m = t > p.at, n = !m && (i === 0 || t > this.POINTS[i - 1].at);
      return { ...p, met: m, now: n, time: m ? fmt(p.at * 16) : '', dec: m ? 'line-through' : 'none', fw: n ? '500' : '400' };
    });
    const cur = pts.find(p => p.now);
    const vis = this.LINES.filter(l => l.at <= t);
    const lastA = [...vis].reverse().find(l => l.who === 'a') || this.LINES[0];
    const words = lastA.text.split(' ');
    const n = Math.min(words.length, (t - lastA.at) * 5 + 4);
    const scr = s.screen;
    return {
      isHome: scr === 'home', isLobby: scr === 'lobby', isLive: scr === 'live', isResults: scr === 'results',
      ready: s.ready, done: s.score >= 84,
      goHome: () => this.go('home'), goLobby: () => this.go('lobby'), goLive: () => this.go('live'),
      stage: { home: 'QUEUE', lobby: 'PAIRING', live: 'ON CALL', results: 'SCORED' }[scr],
      fields: [ { k: 'BANK', v: 'AMIHAN DEMO BANK' }, { k: 'DEBTOR', v: 'J. DIZON · HARDSHIP' }, { k: 'DPD', v: '62' }, { k: 'ASSIGNED BY', v: 'TL M. OCAMPO' } ],
      spike: [ { no: '0413', t: 'Payment Commitment Check-in', b: 'AMIHAN' }, { no: '0414', t: 'Refusal to Pay', b: 'HARBOR' }, { no: '0415', t: 'Standard Negotiation', b: 'LAKBAY' }, { no: '0416', t: 'Settlement Negotiation', b: 'BAYANIHAN' } ],
      recText: s.ready ? 'ARMED' : '...',
      pts, nowLabel: cur ? cur.t.toUpperCase() : 'ALL POINTS MET',
      said: words.slice(0, n).join(' '), rest: words.slice(n).join(' '),
      clock: fmt(t * 16),
      lines: vis.map(l => ({ ...l, ts: fmt(l.at * 16), who: l.who === 'a' ? 'AGENT' : 'DEBTOR', c: l.who === 'a' ? '#1B1D1C' : '#C8321F' })),
      score: s.score,
      crit: [ { t: 'SCRIPT ACCURACY', v: '44 / 50', d: '.1s' }, { t: 'VOICE AND TONE', v: '24 / 30', d: '.3s' }, { t: 'NEGOTIATION', v: '16 / 20', d: '.5s' } ]
    };
  }
}
</script>
<nav class="dc-switch" aria-label="Directions"><a href="../">All</a><a href="practice-path.html">2</a><a href="call-floor.html">3</a><a href="glass-path.html">4</a><a href="glass-console.html">5</a><a href="collection-slip.html" aria-current="page">8</a><a href="game-show.html">9</a></nav>
<script src="../vendor/morphdom-umd.min.js"></script>
<script src="../dc-runtime.js"></script>
<script>
if (window.self !== window.top) document.querySelector('.dc-switch').hidden = true;
DCRuntime.mount(document.getElementById('app'), document.getElementById('tpl'), document.getElementById('logic').textContent);
</script>
</body>
</html>
