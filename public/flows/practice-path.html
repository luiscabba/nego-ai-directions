<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2 Practice Path · Nego AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#2E7A12}a:hover{color:#215A0C}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(62,155,28,.45)}100%{box-shadow:0 0 0 22px rgba(62,155,28,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.enter{animation:enter .45s cubic-bezier(.16,1,.3,1) both}
.pop{animation:pop .5s cubic-bezier(.16,1,.3,1) both}
.bar{transform-origin:center;animation:bar 1s ease-in-out infinite}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.16,1,.3,1) both}
.ring{animation:ring 1.4s ease-out infinite}
.bob{animation:bob 1.6s ease-in-out infinite}
.press:active{transform:translateY(3px);box-shadow:0 1px 0 #2E7A12 !important}
@media (prefers-reduced-motion:reduce){.enter,.pop,.bar,.grow,.ring,.bob{animation:none}}
</style>
<style>
.dc-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(15,18,20,.82);backdrop-filter:blur(12px);font:600 12px/1 system-ui,sans-serif}
.dc-switch a{color:#E8ECEA;text-decoration:none;padding:8px 12px;border-radius:99px}
.dc-switch a:hover{background:rgba(255,255,255,.12)}
.dc-switch a[aria-current]{background:#E8ECEA;color:#111}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><div style="min-height: 900px; background: #FAFBF6; font-family: Figtree, system-ui, sans-serif; color: #1E2A16; display: flex; flex-direction: column">
  <header style="padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #E7EBDD; background: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 24px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #2E7A12">nego</span>
      <nav aria-label="Main" style="display: flex; gap: 4px">
        <button onClick="{{goHome}}" style="padding: 8px 14px; border-radius: 99px; border: 0; background: #E9F4DF; color: #215A0C; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Learn</button>
        <button style="padding: 8px 14px; border-radius: 99px; border: 0; background: transparent; color: #4A5642; font: inherit; font-weight: 600; font-size: 14px">Results</button>
      </nav>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; color: #8A5A00"><svg width="18" height="18" viewBox="0 0 24 24" fill="#F4B63F" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-8z"/></svg>{{streak}} day streak</span>
  </header>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="enter" style="flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; padding: 36px 40px; max-width: 1280px; width: 100%; box-sizing: border-box; margin: 0 auto">
      <main style="grid-column: span 8; display: flex; flex-direction: column; gap: 18px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em">Payment Support path</h1>
        <div style="display: grid; grid-template-columns: 56px 1fr; gap: 18px">
          <div style="display: flex; flex-direction: column; align-items: center"><div style="width: 44px; height: 44px; border-radius: 50%; background: #2E7A12; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div><div style="width: 3px; flex: 1; min-height: 20px; background: #2E7A12"></div></div>
          <div style="padding: 8px 0 20px"><span style="font-weight: 700; font-size: 17px">Standard Negotiation</span><div style="font-size: 14px; color: #5B6752">Passed with 86</div></div>
        </div>
        <div style="display: grid; grid-template-columns: 56px 1fr; gap: 18px">
          <div style="display: flex; flex-direction: column; align-items: center"><div class="ring" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 3px solid #3E9B1C; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; color: #2E7A12">2</div><div style="width: 3px; flex: 1; min-height: 20px; background: #E1E6D6"></div></div>
          <div style="margin-bottom: 20px; background: #FFFFFF; border: 2px solid #2E7A12; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #D3E7C2">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Payment Commitment Check-in</span>
            <span style="font-size: 15px; color: #4A5642">May napag-usapang payment date pero gustong tiyakin kung kaya pa rin ito ng borrower.</span>
            <div style="display: flex; gap: 10px; flex-wrap: wrap">
              <button class="press" onClick="{{goLobby}}" style="padding: 13px 26px; border-radius: 14px; border: 0; background: #3E9B1C; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #2E7A12; cursor: pointer">Practice with a partner</button>
              <button style="padding: 13px 22px; border-radius: 14px; border: 2px solid #E1E6D6; background: #FFFFFF; color: #4A5642; font: inherit; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #E1E6D6">Solo</button>
            </div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 56px 1fr; gap: 18px; opacity: 0.6">
          <div style="display: flex; justify-content: center"><div style="width: 44px; height: 44px; border-radius: 50%; background: #EEF1E7; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; color: #8B9683">3</div></div>
          <div style="padding: 10px 0"><span style="font-weight: 700; font-size: 16px">Affordable Partial Payment</span><div style="font-size: 14px; color: #6A7562">Unlocks after step 2</div></div>
        </div>
      </main>
      <aside style="grid-column: span 4; display: flex; flex-direction: column; gap: 16px">
        <section style="background: #FFFFFF; border: 2px solid #E7EBDD; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">Streak</h2>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{week}}" as="d" hint-placeholder-count="7"><div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 30px; height: 30px; border-radius: 50%; background: {{d.bg}}"></div><span style="font-size: 12px; color: #6A7562; font-weight: 600">{{d.l}}</span></div></sc-for>
          </div>
          <span style="font-size: 14px; color: #4A5642">Lit by a passed role-play.</span>
        </section>
      </aside>
    </div>
  </sc-if>

  <sc-if value="{{isLobby}}" hint-placeholder-val="{{ false }}">
    <div class="enter" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 40px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px">Payment Commitment Check-in</span>
      <div style="display: flex; align-items: center; gap: 48px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div class="pop" style="width: 120px; height: 120px; border-radius: 50%; background: #DCEBCB; border: 4px solid #3E9B1C; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #215A0C">RM</div><span style="font-weight: 800">You · agent</span><span style="font-size: 13px; font-weight: 700; color: #2E7A12">Ready</span></div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; color: #A5B09B">vs</span>
        <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div class="pop" style="width: 120px; height: 120px; border-radius: 50%; background: #F1E4D2; border: 4px solid #F4B63F; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #7A4A12">JD</div><span style="font-weight: 800">Jomar · debtor</span><span style="font-size: 13px; font-weight: 700; color: #8A5A00">Ready</span></div>
        </sc-if>
        <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div class="bob" style="width: 120px; height: 120px; border-radius: 50%; border: 4px dashed #C9D2BE; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #8B9683; font-weight: 700">?</div><span style="font-weight: 800; color: #6A7562">Finding a partner</span><span style="font-size: 13px; color: #6A7562">MC 7 · online now</span></div>
        </sc-if>
      </div>
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
        <button class="pop press" onClick="{{goLive}}" style="padding: 16px 34px; border-radius: 16px; border: 0; background: #3E9B1C; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 17px; box-shadow: 0 5px 0 #2E7A12; cursor: pointer">Start role-play</button>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
    <div class="enter" style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 28px 40px; gap: 26px">
      <div style="width: 100%; max-width: 980px; display: flex; align-items: center; gap: 16px">
        <div style="flex: 1; display: flex; gap: 6px"><sc-for list="{{pts}}" as="p" hint-placeholder-count="5"><div style="flex: 1; height: 14px; border-radius: 7px; background: {{p.seg}}; transition: background .4s"></div></sc-for></div>
        <span style="font-weight: 700; font-variant-numeric: tabular-nums; color: #4A5642">{{clock}}</span>
      </div>
      <span style="font-size: 13px; font-weight: 700; color: #8A5A00; text-transform: uppercase; letter-spacing: 0.05em">{{nowLabel}}</span>
      <div style="width: 100%; max-width: 980px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
        <section style="background: #FFFFFF; border: 2px solid {{debtorBorder}}; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 12px; transition: border-color .3s">
          <span style="font-weight: 700; font-size: 14px; color: #7A4A12">Jomar · debtor</span>
          <p style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 500">{{debtorLine}}</p>
        </section>
        <section style="background: #FFFFFF; border: 2px solid #3E9B1C; border-radius: 22px; padding: 26px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 #D3E7C2">
          <span style="font-weight: 700; font-size: 14px; color: #2E7A12">Your line</span>
          <p style="margin: 0; font-size: 21px; line-height: 1.5; font-weight: 600"><span style="background: #DDF0CF; border-radius: 6px">{{said}}</span> <span style="color: #9AA592">{{rest}}</span></p>
          <div style="display: flex; gap: 3px; align-items: center; height: 36px" aria-hidden="true"><sc-for list="{{wave}}" as="w" hint-placeholder-count="28"><div class="bar" style="width: 5px; border-radius: 3px; background: #3E9B1C; height: {{w.h}}; animation-delay: {{w.d}}"></div></sc-for></div>
        </section>
      </div>
      <div style="width: 100%; max-width: 980px; display: flex; gap: 10px; flex-wrap: wrap">
        <sc-for list="{{metList}}" as="m" hint-placeholder-count="2"><span class="pop" style="padding: 8px 14px; border-radius: 99px; background: #E9F4DF; color: #215A0C; font-weight: 700; font-size: 14px">{{m.t}}</span></sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isResults}}" hint-placeholder-val="{{ false }}">
    <div class="enter" style="flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; padding: 40px; max-width: 1180px; width: 100%; box-sizing: border-box; margin: 0 auto; align-content: start">
      <section style="grid-column: span 5; background: #FFFFFF; border: 2px solid #2E7A12; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 6px 0 #D3E7C2">
        <div style="width: 200px; height: 200px; border-radius: 50%; background: {{ringBg}}; display: flex; align-items: center; justify-content: center">
          <div style="width: 160px; height: 160px; border-radius: 50%; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; font-variant-numeric: tabular-nums; line-height: 1">{{score}}</span><span style="font-size: 13px; color: #6A7562">of 100</span></div>
        </div>
        <sc-if value="{{done}}" hint-placeholder-val="{{ true }}"><span class="pop" style="padding: 10px 18px; border-radius: 14px; background: #3E9B1C; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; transform: rotate(-3deg)">Passed · day 6 lit</span></sc-if>
      </section>
      <section style="grid-column: span 7; display: flex; flex-direction: column; gap: 18px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px">Payment Commitment Check-in</h1>
        <sc-for list="{{crit}}" as="c" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-weight: 700"><span>{{c.t}}</span><span style="font-variant-numeric: tabular-nums">{{c.v}}</span></div><div style="height: 12px; border-radius: 6px; background: #EEF1E7; overflow: hidden"><div class="grow" style="height: 12px; border-radius: 6px; background: #3E9B1C; width: {{c.w}}; animation-delay: {{c.d}}"></div></div></div>
        </sc-for>
        <div style="padding: 16px 18px; border-radius: 16px; background: #FFF6E0; font-size: 15px; line-height: 1.5"><b>Coach tip:</b> Offer the split sooner. Jomar mentioned the lost sideline at 01:45.</div>
        <div style="display: flex; gap: 10px">
          <button class="press" onClick="{{goHome}}" style="padding: 13px 24px; border-radius: 14px; border: 0; background: #3E9B1C; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #2E7A12; cursor: pointer">Continue path</button>
          <button onClick="{{goLive}}" style="padding: 13px 22px; border-radius: 14px; border: 2px solid #E1E6D6; background: #FFFFFF; color: #4A5642; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Replay</button>
        </div>
      </section>
    </div>
  </sc-if>
</div></template>
<script id="logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) { super(props);
this.POINTS = [
  { t: 'Verify identity', at: 2 }, { t: 'Confirm PTP', at: 5 }, { t: 'Probe ability to pay', at: 10 },
  { t: 'Offer partial', at: 14 }, { t: 'Recap and close', at: 18 }
];
this.LINES = [
  { at: 0, who: 'a', text: 'Magandang hapon po, si Rica po ito ng Amihan Bank. Si Mr. Jomar Dizon po ba ito?' },
  { at: 2, who: 'd', text: 'Oo, ako nga. Ano yun?' },
  { at: 3, who: 'a', text: 'I-confirm ko lang po ang ₱12,000 natin sa 25 Oct.' },
  { at: 6, who: 'd', text: 'Medyo mahirap ngayon. Nawalan ako ng sideline.' },
  { at: 8, who: 'a', text: 'Naiintindihan ko po. Ano po ang pinagkukunan natin ng pambayad ngayong buwan?' },
  { at: 11, who: 'd', text: 'Baka kalahati lang kaya ko sa 25.' },
  { at: 12, who: 'a', text: 'Pwede po nating hatiin: ₱6,000 sa 25 Oct at ₱6,000 sa 8 Nov.' },
  { at: 15, who: 'd', text: 'Sige, kaya ko yun.' },
  { at: 16, who: 'a', text: 'Recap po: ₱6,000 sa 25 Oct, ₱6,000 sa 8 Nov. Salamat po, Mr. Dizon.' }
];
    this.state = { screen: 'home', tick: 0, ready: false, score: 0 }; }
  componentWillUnmount() { this.stop(); }
  stop() { if (this.iv) { clearInterval(this.iv); this.iv = null; } if (this.to) { clearTimeout(this.to); this.to = null; } }
  go(screen) {
    this.stop();
    this.setState({ screen, tick: 0, ready: false, score: 0 });
    if (screen === 'lobby') this.to = setTimeout(() => this.setState({ ready: true }), 1800);
    if (screen === 'live') this.iv = setInterval(() => { const t = this.state.tick + 1; if (t > 20) { this.go('results'); return; } this.setState({ tick: t }); }, 750);
    if (screen === 'results') this.iv = setInterval(() => { const s = Math.min(84, this.state.score + 2); this.setState({ score: s }); if (s >= 84) this.stop(); }, 25);
  }
  renderVals() {
    const s = this.state, t = s.tick;
    const pts = this.POINTS.map((p, i) => {
      const met = t > p.at, now = !met && (i === 0 || t > this.POINTS[i - 1].at);
      return { ...p, met, now, seg: met ? '#3E9B1C' : now ? '#B9DCA4' : '#E7EBDD' };
    });
    const vis = this.LINES.filter(l => l.at <= t);
    const lastA = [...vis].reverse().find(l => l.who === 'a') || this.LINES[0];
    const lastD = [...vis].reverse().find(l => l.who === 'd');
    const words = lastA.text.split(' ');
    const n = Math.min(words.length, (t - lastA.at) * 5 + 4);
    const sec = t * 16;
    const cur = pts.find(p => p.now);
    const on = '#3E9B1C', off = '#EEF1E7';
    return {
      isHome: s.screen === 'home', isLobby: s.screen === 'lobby', isLive: s.screen === 'live', isResults: s.screen === 'results',
      ready: s.ready, notReady: !s.ready, done: s.score >= 84,
      goHome: () => this.go('home'), goLobby: () => this.go('lobby'), goLive: () => this.go('live'),
      streak: s.screen === 'results' && s.score >= 84 ? 6 : 5,
      week: ['M','T','W','T','F','S','S'].map((l, i) => ({ l, bg: i < 5 ? on : off })),
      pts, metList: pts.filter(p => p.met),
      nowLabel: cur ? 'Point ' + (pts.indexOf(cur) + 1) + ' · ' + cur.t : 'All points met',
      clock: String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'),
      debtorLine: lastD ? lastD.text : 'Waiting for Jomar...',
      debtorBorder: vis.length && vis[vis.length - 1].who === 'd' ? '#F4B63F' : '#E7EBDD',
      said: words.slice(0, n).join(' '), rest: words.slice(n).join(' '),
      wave: [10,18,26,34,22,30,36,20,14,28,34,18,12,24,30,16,10,20,28,14,10,18,24,12,8,16,20,10].map((h, i) => ({ h: h + 'px', d: (i * 0.06) + 's' })),
      score: s.score,
      ringBg: 'conic-gradient(#3E9B1C ' + (s.score * 3.6) + 'deg, #EEF1E7 0deg)',
      crit: [
        { t: 'Script accuracy', v: '44 / 50', w: '88%', d: '0.1s' },
        { t: 'Voice and tone', v: '24 / 30', w: '80%', d: '0.3s' },
        { t: 'Negotiation', v: '16 / 20', w: '80%', d: '0.5s' }
      ]
    };
  }
}
</script>

<script>
if (window.self !== window.top) document.querySelector('.dc-switch').hidden = true;
DCRuntime.mount(document.getElementById('app'), document.getElementById('tpl'), document.getElementById('logic').textContent);
</script>
</body>
