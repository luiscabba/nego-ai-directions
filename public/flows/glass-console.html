<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 Glass Console · Nego AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#7FE3C0}a:hover{color:#B3F0DA}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,50px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,70px)}}
@keyframes bar{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(127,227,192,.5)}100%{box-shadow:0 0 0 26px rgba(127,227,192,0)}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:enter .6s cubic-bezier(.16,1,.3,1) both}
.b1{animation:drift1 16s ease-in-out infinite}.b2{animation:drift2 20s ease-in-out infinite}
.bar{transform-origin:center;animation:bar .9s ease-in-out infinite}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.16,1,.3,1) both}
.pop{animation:pop .5s cubic-bezier(.16,1,.3,1) both}
.halo{animation:halo 1.4s ease-out infinite}
.slide{animation:slide .4s ease-out both}
@media (prefers-reduced-motion:reduce){.enter,.b1,.b2,.bar,.grow,.pop,.halo,.slide{animation:none}}
</style>
<link rel="stylesheet" href="../mobile.css">
<style>
.dc-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(15,18,20,.82);backdrop-filter:blur(12px);font:600 12px/1 system-ui,sans-serif}
.dc-switch a{color:#E8ECEA;text-decoration:none;padding:8px 12px;border-radius:99px}
.dc-switch a:hover{background:rgba(255,255,255,.12)}
.dc-switch a[aria-current]{background:#E8ECEA;color:#111}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><div style="position: relative; overflow: hidden; min-height: 900px; font-family: Sora, system-ui, sans-serif; color: #E6F0EE; background: #0A1012; display: flex; flex-direction: column">
  <div class="b1" aria-hidden="true" style="position: absolute; left: -160px; top: -120px; width: 820px; height: 620px; border-radius: 50%; background: radial-gradient(closest-side, rgba(38,160,128,0.5), transparent)"></div>
  <div class="b2" aria-hidden="true" style="position: absolute; right: -160px; top: 60px; width: 760px; height: 580px; border-radius: 50%; background: radial-gradient(closest-side, rgba(46,86,170,0.45), transparent)"></div>
  <div class="b1" aria-hidden="true" style="position: absolute; left: 35%; bottom: -300px; width: 640px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(214,140,50,0.26), transparent)"></div>

  <header style="position: relative; padding: 20px 28px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
    <div style="display: flex; align-items: center; gap: 12px">
      <button onClick="{{goHome}}" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: linear-gradient(140deg, #5FE0B4, #2A9D7C); color: #06231A; font: inherit; font-weight: 700; cursor: pointer">N</button>
      <span style="padding: 7px 12px; border-radius: 99px; background: rgba(127,227,192,0.14); border: 1px solid rgba(127,227,192,0.3); color: #7FE3C0; font-family: 'JetBrains Mono', monospace; font-size: 12px">{{stateLabel}}</span>
    </div>
    <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 99px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16); backdrop-filter: blur(24px)">
        <span style="display: flex; align-items: center; gap: 6px; padding: 0 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #F59C86"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F0705A"></span>REC {{clock}}</span>
        <button onClick="{{goResults}}" style="padding: 10px 18px; border-radius: 99px; border: 0; background: #D9503A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">End</button>
      </div>
    </sc-if>
  </header>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="enter" style="position: relative; flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; padding: 24px 28px; align-content: start">
      <section style="grid-column: span 7; border-radius: 28px; padding: 32px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 30px 80px rgba(0,0,0,0.35); backdrop-filter: blur(28px) saturate(160%); display: flex; flex-direction: column; gap: 18px">
        <span style="font-size: 13px; color: #F2C287; font-weight: 600">Coaching ticket · Major</span>
        <h1 style="margin: 0; font-size: 38px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em">Affordable Partial Payment</h1>
        <p style="margin: 0; font-size: 15px; color: #C3D2CF; max-width: 50ch">3 live calls this week with no partial offered after a hardship claim. Pass this once to close the ticket.</p>
        <div style="display: flex; gap: 10px"><button onClick="{{goLobby}}" style="padding: 14px 26px; border-radius: 99px; border: 0; background: linear-gradient(140deg, #7FE3C0, #3FB68B); color: #06231A; font: inherit; font-weight: 700; font-size: 15px; box-shadow: 0 10px 30px rgba(63,182,139,0.35); cursor: pointer">Start duo</button><button style="padding: 14px 22px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #E6F0EE; font: inherit; font-weight: 600; font-size: 15px">Solo first</button></div>
      </section>
      <section style="grid-column: span 5; border-radius: 28px; padding: 24px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.14); backdrop-filter: blur(28px); display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Last 6 scores</h2>
        <div style="position: relative; display: flex; gap: 10px; align-items: flex-end; height: 110px"><div style="position: absolute; left: 0; right: 0; bottom: 88px; border-top: 1px dashed rgba(127,227,192,0.6)"></div><sc-for list="{{scores}}" as="s" hint-placeholder-count="6"><div class="slide" style="flex: 1; border-radius: 8px 8px 2px 2px; background: {{s.c}}; height: {{s.h}}; animation-delay: {{s.d}}"></div></sc-for></div>
        <div style="display: flex; gap: 10px"><sc-for list="{{scores}}" as="s" hint-placeholder-count="6"><span style="flex: 1; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C3D2CF">{{s.v}}</span></sc-for></div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{isLobby}}" hint-placeholder-val="{{ false }}">
    <div class="enter" style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">
      <div style="display: flex; align-items: center">
        <div class="halo" style="width: 130px; height: 130px; border-radius: 50%; background: rgba(127,227,192,0.14); border: 1px solid rgba(127,227,192,0.4); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; color: #7FE3C0">RM</div>
        <div style="width: 200px; height: 2px; background: rgba(255,255,255,0.1); overflow: hidden"><sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><div class="grow" style="height: 2px; background: linear-gradient(90deg, #7FE3C0, #F2C287)"></div></sc-if></div>
        <div style="width: 130px; height: 130px; border-radius: 50%; background: {{dBg}}; border: 1px solid {{dBd}}; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; color: #F2C287; transition: background .5s, border-color .5s">JD</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-size: 22px; font-weight: 600">{{dialText}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9FB3AF">Amihan Demo Bank · Affordable Partial Payment</span></div>
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><button class="pop" onClick="{{goLive}}" style="padding: 15px 32px; border-radius: 99px; border: 0; background: linear-gradient(140deg, #7FE3C0, #3FB68B); color: #06231A; font: inherit; font-weight: 700; font-size: 16px; box-shadow: 0 10px 30px rgba(63,182,139,0.35); cursor: pointer">Go live</button></sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
    <div class="enter" style="position: relative; flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; padding: 20px 28px">
      <div style="grid-column: span 8; display: flex; flex-direction: column; gap: 20px">
        <section style="border-radius: 32px; padding: 34px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.13); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 30px 80px rgba(0,0,0,0.35); backdrop-filter: blur(30px) saturate(160%); display: flex; align-items: center; justify-content: space-between; gap: 20px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div style="width: 108px; height: 108px; border-radius: 50%; background: rgba(127,227,192,0.14); box-shadow: {{aGlow}}; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #7FE3C0; transition: box-shadow .4s">RM</div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{aCol}}">{{aState}}</span></div>
          <div style="flex: 1; display: flex; gap: 3px; align-items: center; justify-content: center; height: 80px" aria-hidden="true"><sc-for list="{{wave}}" as="w" hint-placeholder-count="40"><div class="bar" style="width: 4px; border-radius: 2px; background: {{waveCol}}; height: {{w.h}}; animation-delay: {{w.d}}; transition: background .4s"></div></sc-for></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div style="width: 108px; height: 108px; border-radius: 50%; background: rgba(242,194,135,0.10); box-shadow: {{dGlow}}; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: #F2C287; transition: box-shadow .4s">JD</div><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{dCol}}">{{dState}}</span></div>
        </section>
        <section style="border-radius: 28px; padding: 24px 30px; background: rgba(255,255,255,0.08); border: 1px solid rgba(127,227,192,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 10px">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7FE3C0">{{nowLabel}}</span>
          <p style="margin: 0; font-size: 21px; line-height: 1.5"><span>{{said}}</span> <span style="color: #7C918D">{{rest}}</span></p>
        </section>
        <sc-if value="{{hasDebtor}}" hint-placeholder-val="{{ true }}"><div class="slide" style="padding: 0 6px; font-size: 15px; color: #C3D2CF"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #F2C287">JOMAR </span>{{debtorLine}}</div></sc-if>
      </div>
      <aside style="grid-column: span 4; border-radius: 28px; padding: 24px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.14); backdrop-filter: blur(28px); display: flex; flex-direction: column; gap: 10px; align-self: start">
        <div style="display: flex; justify-content: space-between; padding-bottom: 6px"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Required points</h2><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9FB3AF">{{metCount}}/5</span></div>
        <sc-for list="{{pts}}" as="p" hint-placeholder-count="5"><div style="display: flex; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 16px; background: {{p.bg}}; border: 1px solid {{p.bd}}; transition: background .4s, border-color .4s"><span style="font-size: 14px; color: {{p.fg}}">{{p.t}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7FE3C0">{{p.time}}</span></div></sc-for>
      </aside>
    </div>
  </sc-if>

  <sc-if value="{{isResults}}" hint-placeholder-val="{{ false }}">
    <div class="enter" style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px">
      <section style="width: 100%; max-width: 1000px; border-radius: 32px; padding: 40px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 30px 80px rgba(0,0,0,0.4); backdrop-filter: blur(30px) saturate(160%); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px; align-items: center">
        <div style="grid-column: span 5; display: flex; flex-direction: column; align-items: center; gap: 16px">
          <div style="width: 220px; height: 220px; border-radius: 50%; background: {{scoreRing}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 60px rgba(127,227,192,0.25)"><div style="width: 184px; height: 184px; border-radius: 50%; background: #0F1A1C; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 58px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1">{{score}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9FB3AF">/ 100</span></div></div>
          <sc-if value="{{done}}" hint-placeholder-val="{{ true }}"><span class="pop" style="padding: 9px 16px; border-radius: 99px; background: rgba(127,227,192,0.16); border: 1px solid rgba(127,227,192,0.4); color: #7FE3C0; font-family: 'JetBrains Mono', monospace; font-size: 12px">PASSED · TICKET CLOSED</span></sc-if>
        </div>
        <div style="grid-column: span 7; display: flex; flex-direction: column; gap: 18px">
          <h1 style="margin: 0; font-size: 26px; font-weight: 600">Affordable Partial Payment</h1>
          <sc-for list="{{crit}}" as="c" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 14px"><span>{{c.t}}</span><span style="font-family: 'JetBrains Mono', monospace">{{c.v}}</span></div><div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden"><div class="grow" style="height: 8px; border-radius: 4px; background: linear-gradient(90deg, #7FE3C0, #2A9D7C); width: {{c.w}}; animation-delay: {{c.d}}"></div></div></div></sc-for>
          <div style="padding: 14px 18px; border-radius: 18px; background: rgba(242,194,135,0.10); border: 1px solid rgba(242,194,135,0.25); color: #F2D3A8; font-size: 14px">Offer the split sooner. Hardship came up at 01:36.</div>
          <div style="display: flex; gap: 10px"><button onClick="{{goHome}}" style="padding: 13px 24px; border-radius: 99px; border: 0; background: linear-gradient(140deg, #7FE3C0, #3FB68B); color: #06231A; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer">Back to queue</button><button onClick="{{goLive}}" style="padding: 13px 22px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #E6F0EE; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Replay</button></div>
        </div>
      </section>
    </div>
  </sc-if>
</div></template>
<script id="logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.POINTS = [
      { t: 'Verify identity', at: 2 }, { t: 'Confirm PTP date and amount', at: 5 }, { t: 'Probe ability to pay', at: 10 },
      { t: 'Offer partial if needed', at: 14 }, { t: 'Recap and close', at: 18 }
    ];
    this.LINES = [
      { at: 0, who: 'a', text: 'Magandang hapon po, si Rica po ito ng Amihan Bank. Si Mr. Jomar Dizon po ba ito?' },
      { at: 2, who: 'd', text: 'Oo, ako nga. Ano yun?' },
      { at: 3, who: 'a', text: 'I-confirm ko lang po ang ₱12,000 natin sa 25 Oct.' },
      { at: 6, who: 'd', text: 'Medyo mahirap ngayon. Nawalan ako ng sideline.' },
      { at: 8, who: 'a', text: 'Naiintindihan ko po. Ano po ang pinagkukunan natin ng pambayad ngayong buwan?' },
      { at: 11, who: 'd', text: 'Baka kalahati lang kaya ko sa 25.' },
      { at: 12, who: 'a', text: 'Pwede po nating hatiin: ₱6,000 sa 25 Oct at ₱6,000 sa 8 Nov.' },
      { at: 15, who: 'd', text: 'Sige, kaya ko yun.' },
      { at: 16, who: 'a', text: 'Recap po: ₱6,000 sa 25 Oct, ₱6,000 sa 8 Nov. Salamat po, Mr. Dizon.' }
    ];
    this.state = { screen: 'home', tick: 0, ready: false, score: 0 };
  }
  componentWillUnmount() { this.stop(); }
  stop() { if (this.iv) { clearInterval(this.iv); this.iv = null; } if (this.to) { clearTimeout(this.to); this.to = null; } }
  go(screen) {
    this.stop();
    this.setState({ screen, tick: 0, ready: false, score: 0 });
    if (screen === 'lobby') this.to = setTimeout(() => this.setState({ ready: true }), 2000);
    if (screen === 'live') this.iv = setInterval(() => { const t = this.state.tick + 1; if (t > 20) { this.go('results'); return; } this.setState({ tick: t }); }, 750);
    if (screen === 'results') this.iv = setInterval(() => { const s = Math.min(84, this.state.score + 2); this.setState({ score: s }); if (s >= 84) this.stop(); }, 25);
  }
  renderVals() {
    const s = this.state, t = s.tick;
    const fmt = x => String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
    const met = { bg: 'rgba(127,227,192,0.12)', bd: 'rgba(127,227,192,0.25)', fg: '#E6F0EE' };
    const now = { bg: 'rgba(255,255,255,0.10)', bd: 'rgba(127,227,192,0.6)', fg: '#FFFFFF' };
    const todo = { bg: 'rgba(255,255,255,0.03)', bd: 'rgba(255,255,255,0.08)', fg: '#9FB3AF' };
    const pts = this.POINTS.map((p, i) => {
      const m = t > p.at, n = !m && (i === 0 || t > this.POINTS[i - 1].at);
      return { ...p, now: n, met: m, time: m ? fmt(p.at * 16) : n ? 'NOW' : '', ...(m ? met : n ? now : todo) };
    });
    const cur = pts.find(p => p.now);
    const vis = this.LINES.filter(l => l.at <= t);
    const last = vis[vis.length - 1] || this.LINES[0];
    const lastA = [...vis].reverse().find(l => l.who === 'a') || this.LINES[0];
    const lastD = [...vis].reverse().find(l => l.who === 'd');
    const words = lastA.text.split(' ');
    const n = Math.min(words.length, (t - lastA.at) * 5 + 4);
    const aTalk = last.who === 'a';
    const glowA = '0 0 0 6px rgba(127,227,192,0.18), 0 0 0 14px rgba(127,227,192,0.08), 0 0 50px rgba(127,227,192,0.5)';
    const glowD = '0 0 0 6px rgba(242,194,135,0.18), 0 0 0 14px rgba(242,194,135,0.08), 0 0 50px rgba(242,194,135,0.45)';
    const sc = [72, 84, 78, 88, 75, 86];
    const scr = s.screen;
    return {
      isHome: scr === 'home', isLobby: scr === 'lobby', isLive: scr === 'live', isResults: scr === 'results',
      ready: s.ready, done: s.score >= 84,
      goHome: () => this.go('home'), goLobby: () => this.go('lobby'), goLive: () => this.go('live'), goResults: () => this.go('results'),
      stateLabel: { home: 'READY', lobby: s.ready ? 'CONNECTED' : 'CONNECTING', live: 'LIVE', results: 'WRAP UP' }[scr],
      scores: sc.map((v, i) => ({ v, h: Math.round(v * 1.1) + 'px', d: (i * 0.06) + 's', c: v >= 80 ? 'linear-gradient(180deg, #7FE3C0, #2A9D7C)' : 'rgba(255,255,255,0.14)' })),
      dBg: s.ready ? 'rgba(242,194,135,0.16)' : 'rgba(255,255,255,0.04)', dBd: s.ready ? 'rgba(242,194,135,0.5)' : 'rgba(255,255,255,0.12)',
      dialText: s.ready ? 'Jomar D. joined as debtor' : 'Connecting a partner',
      aGlow: aTalk ? glowA : 'none', dGlow: aTalk ? 'none' : glowD,
      aState: aTalk ? 'SPEAKING' : 'LISTENING', dState: aTalk ? 'LISTENING' : 'SPEAKING',
      aCol: aTalk ? '#7FE3C0' : '#6F827E', dCol: aTalk ? '#6F827E' : '#F2C287',
      waveCol: aTalk ? '#7FE3C0' : '#F2C287',
      wave: [6,10,18,30,22,40,56,34,20,44,60,38,24,48,64,40,26,52,36,20,30,44,28,16,12,20,30,18,10,14,22,12,8,10,14,8,6,8,10,6].map((h, i) => ({ h: h + 'px', d: (i * 0.04) + 's' })),
      nowLabel: cur ? 'STEP 0' + (pts.indexOf(cur) + 1) + ' · ' + cur.t.toUpperCase() : 'ALL POINTS MET',
      said: words.slice(0, n).join(' '), rest: words.slice(n).join(' '),
      hasDebtor: !!lastD, debtorLine: lastD ? lastD.text : '',
      pts, metCount: pts.filter(p => p.met).length, clock: fmt(t * 16),
      score: s.score, scoreRing: 'conic-gradient(#7FE3C0 ' + (s.score * 3.6) + 'deg, rgba(255,255,255,0.08) 0deg)',
      crit: [ { t: 'Script accuracy', v: '44/50', w: '88%', d: '.1s' }, { t: 'Voice and tone', v: '24/30', w: '80%', d: '.3s' }, { t: 'Negotiation', v: '16/20', w: '80%', d: '.5s' } ]
    };
  }
}
</script>
