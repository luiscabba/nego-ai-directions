<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4+ Glass Path App · Nego AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#1F7A2E}a:hover{color:#155A21}
.gp{position:relative;overflow:hidden;min-height:900px;font-family:Onest,system-ui,sans-serif;color:#12301A;background:#EEF5EF;display:flex;flex-direction:column}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.glass{background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,0 22px 54px rgba(40,90,50,.11);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%)}
.glass.hi{background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 #fff,0 0 0 2px rgba(31,122,46,.45),0 24px 54px rgba(31,122,46,.16)}
.pill{border-radius:99px}
.r28{border-radius:28px}.r20{border-radius:20px}
.scr{position:relative;flex:1;padding:24px 40px 48px;display:flex;flex-direction:column;gap:20px;max-width:1360px;width:100%;box-sizing:border-box;margin:0 auto}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.h1{margin:0;font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.h2{margin:0;font-size:18px;font-weight:700}
.eyebrow{font-size:14px;font-weight:600;color:#3E5C44}
.muted{color:#4C6652}
.btn{border:0;font:inherit;font-weight:700;font-size:15px;padding:14px 24px;border-radius:99px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:#1F7A2E;color:#fff;box-shadow:0 10px 24px rgba(31,122,46,.32)}
.btn.sec{background:rgba(255,255,255,.75);color:#12301A}
.btn.sm{padding:9px 16px;font-size:13px}
.nav{border:0;background:transparent;color:#2D4A33;font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:99px;cursor:pointer}
.nav.on{background:#1F7A2E;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(255,255,255,.7)}
.chip.g{background:rgba(31,122,46,.14);color:#155A21}
.chip.a{background:rgba(244,182,63,.25);color:#7A4A00}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.55)}
.st{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.8);color:#4C6652;white-space:nowrap}
.st.passed{background:rgba(31,122,46,.15);color:#155A21}.st.ticket{background:rgba(244,182,63,.28);color:#7A4A00}.st.progress{background:rgba(120,190,240,.3);color:#1D4E73}.st.locked{opacity:.6}
.bank{text-align:left;border:0;font:inherit;color:inherit;cursor:pointer;padding:22px;border-radius:24px;display:flex;flex-direction:column;gap:14px;transition:transform .2s cubic-bezier(.16,1,.3,1)}
.bank:hover{transform:translateY(-3px)}
.ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px}
.step{text-align:left;border:0;background:transparent;font:inherit;color:#2D4A33;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px}
.step b{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.step.on{background:rgba(255,255,255,.75);color:#12301A;font-weight:700}
.step.on b{background:#1F7A2E;color:#fff}
.pt{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.4);font-size:14px;transition:background .4s,box-shadow .4s}
.pt.met{background:rgba(31,122,46,.13);color:#155A21;font-weight:600}
.pt.now{background:rgba(255,255,255,.85);box-shadow:0 0 0 2px #1F7A2E}
.pt.todo{color:#6A8070}
.mo{position:absolute;top:-6px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);border:3px solid #fff}
.mo.met{background:#1F7A2E}.mo.late{background:#F4B63F}
.tab{border:0;font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:99px;background:transparent;color:#2D4A33;cursor:pointer}
.tab.on{background:#fff;color:#12301A;box-shadow:0 4px 12px rgba(40,90,50,.12)}
.ln{display:flex;flex-direction:column;gap:4px;max-width:78%;padding:12px 16px;border-radius:18px}
.ln.a{align-self:flex-end;background:rgba(255,255,255,.8)}
.ln.d{align-self:flex-start;background:rgba(255,255,255,.45)}
.tb{flex:1;border-radius:10px 10px 4px 4px;background:rgba(31,122,46,.3)}
.tb.on{background:linear-gradient(180deg,#3FB34F,#1F7A2E)}
.hs{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.55);font-size:14px}
.hs .sc{font-weight:800;font-size:18px}
.hs.pass .sc{color:#1F7A2E}.hs.miss .sc{color:#9A5A0E}
.lb{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.55)}
.lb.Ongoing{opacity:.6}
.av{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#1F7A2E}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,40px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,60px)}}
@keyframes bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes inL{from{transform:translateX(-200px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(200px);opacity:.3}to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.enter{animation:enter .55s cubic-bezier(.16,1,.3,1) both}
.b1{animation:drift1 14s ease-in-out infinite}.b2{animation:drift2 18s ease-in-out infinite}
.bar{transform-origin:center;animation:bar 1s ease-in-out infinite}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.16,1,.3,1) both}
.rise{transform-origin:bottom;animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.pop{animation:pop .5s cubic-bezier(.16,1,.3,1) both}
.inL{animation:inL .9s cubic-bezier(.16,1,.3,1) both}.inR{animation:inR .9s cubic-bezier(.16,1,.3,1) both}
.float{animation:float 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.enter,.b1,.b2,.bar,.grow,.rise,.pop,.inL,.inR,.float{animation:none}}
@media (max-width:760px){
.scr{padding:16px 16px 80px}
.row{display:flex;flex-direction:column;gap:16px}
.h1{font-size:30px}
.card{padding:20px}
.top{padding:14px 16px 0 !important;flex-wrap:wrap}
.top nav{width:100%;box-sizing:border-box;justify-content:space-between}.top nav>span{display:none}.nav{white-space:nowrap;padding:8px 10px;font-size:13px}
.ln{max-width:92%}
.lb{grid-template-columns:40px 1fr auto}.lb .hide-m{display:none}
.hs{grid-template-columns:1fr auto}.hs .hide-m{display:none}
.stage{flex-direction:column !important;gap:14px !important}
.stage .link{width:3px !important;height:30px !important}
.orb{width:120px !important;height:120px !important}
.dock{flex-wrap:wrap;justify-content:center;border-radius:28px !important}
.bigring{width:170px !important;height:170px !important}.bigring>div{width:138px !important;height:138px !important}
}
</style>
<link rel="stylesheet" href="../mobile.css">
<style>
.dc-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(15,18,20,.82);backdrop-filter:blur(12px);font:600 12px/1 system-ui,sans-serif}
.dc-switch a{color:#E8ECEA;text-decoration:none;padding:8px 12px;border-radius:99px}
.dc-switch a:hover{background:rgba(255,255,255,.12)}
.dc-switch a[aria-current]{background:#E8ECEA;color:#111}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><div class="gp">
  <div class="blob b1" aria-hidden="true" style="left: -120px; top: -100px; width: 760px; height: 600px; background: radial-gradient(closest-side, #B8EBA8, transparent)"></div>
  <div class="blob b2" aria-hidden="true" style="right: -140px; top: 40px; width: 700px; height: 560px; background: radial-gradient(closest-side, #BFE3F7, transparent)"></div>
  <div class="blob b1" aria-hidden="true" style="left: 40%; bottom: -260px; width: 700px; height: 520px; background: radial-gradient(closest-side, #FDE3B8, transparent)"></div>

  <header class="top" style="position: relative; padding: 24px 40px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 1360px; width: 100%; box-sizing: border-box; margin: 0 auto">
    <nav aria-label="Main" class="glass pill" style="display: flex; align-items: center; gap: 4px; padding: 6px">
      <span style="padding: 0 12px 0 10px; font-weight: 800; font-size: 18px; color: #1F7A2E">nego</span>
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><button class="{{n.cls}}" onClick="{{n.go}}">{{n.t}}</button></sc-for>
    </nav>
    <div class="glass pill" style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px">
      <span style="font-weight: 700; font-size: 14px; color: #8A5300">{{streak}} day streak</span>
      <div class="av" style="width: 34px; height: 34px; font-size: 12px">RM</div>
    </div>
  </header>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="scr enter">
      <div class="row">
        <section class="glass r28 card c8" style="padding: 34px; gap: 18px">
          <span class="eyebrow">{{bankName}} · Up next</span>
          <h1 class="h1" style="max-width: 15ch">{{scriptTitle}}</h1>
          <p style="margin: 0; font-size: 17px; max-width: 54ch" class="muted">{{scriptScenario}}</p>
          <div style="display: flex; gap: 8px; flex-wrap: wrap"><span class="chip a">From coaching ticket</span><span class="chip">{{scriptMin}} min read</span><span class="chip">5 required points</span></div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap"><button class="btn pri" onClick="{{goHub}}">Practice now</button><button class="btn sec" onClick="{{readCurrent}}">Read script</button></div>
        </section>
        <section class="glass r28 card c4">
          <h2 class="h2">This week</h2>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{week}}" as="d" hint-placeholder-count="7"><div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 30px; height: 30px; border-radius: 50%; background: {{d.bg}}; box-shadow: {{d.sh}}"></div><span style="font-size: 12px; font-weight: 600" class="muted">{{d.l}}</span></div></sc-for>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>Level 7</span><span class="muted">{{xpText}}</span></div>
          <div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); overflow: hidden"><div style="height: 10px; border-radius: 5px; background: linear-gradient(90deg, #3FB34F, #1F7A2E); width: {{xp}}; transition: width 1s"></div></div>
        </section>
      </div>
      <div class="row">
        <section class="glass r28 card c7">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h2">Recent role-plays</h2><button class="btn sec sm" onClick="{{goProgress}}">All results</button></div>
          <div class="list"><sc-for list="{{historyTop}}" as="h" hint-placeholder-count="3"><div class="{{h.cls}}"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{h.t}}</span><span class="muted" style="font-size: 13px">{{h.d}} · {{h.with}}</span></div><span class="hide-m muted" style="font-size: 13px">{{h.res}}</span><span class="sc">{{h.s}}</span></div></sc-for></div>
        </section>
        <section class="glass r28 card c5">
          <h2 class="h2">Skills</h2>
          <sc-for list="{{skills}}" as="k" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">{{k.t}}</span><span class="muted">{{k.v}}</span></div><div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,.75); overflow: hidden"><div class="grow" style="height: 8px; border-radius: 4px; background: linear-gradient(90deg, #3FB34F, #1F7A2E); width: {{k.w}}; animation-delay: {{k.d}}"></div></div></div></sc-for>
        </section>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isBooks}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter">
      <h1 class="h1">Playbooks</h1>
      <div class="row">
        <sc-for list="{{banks}}" as="b" hint-placeholder-count="4">
          <button class="glass bank c6" onClick="{{b.open}}">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%">
              <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 22px; font-weight: 800; letter-spacing: -.01em">{{b.name}}</span><span class="muted" style="font-size: 14px">TL {{b.tl}} · {{b.total}} scripts</span></div>
              <div class="ring" style="background: conic-gradient(#1F7A2E {{b.deg}}, rgba(255,255,255,.7) 0deg)"><i>{{b.label}}</i></div>
            </div>
            <span class="chip g" style="align-self: flex-start">{{b.note}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isBook}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 6px"><button class="btn sec sm" onClick="{{goBooks}}" style="align-self: flex-start">All playbooks</button><h1 class="h1">{{bankName}}</h1></div>
        <span class="chip">TL {{bankTl}} · {{bankDone}} of {{bankTotal}} passed</span>
      </div>
      <div class="list">
        <sc-for list="{{scripts}}" as="x" hint-placeholder-count="5">
          <div class="glass r20" style="display: grid; grid-template-columns: 44px 1fr auto; gap: 16px; align-items: center; padding: 18px 20px">
            <div class="av" style="background: rgba(255,255,255,.85)">{{x.n}}</div>
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"><span style="font-weight: 700; font-size: 17px">{{x.t}}</span><span class="{{x.cls}}">{{x.label}}</span></div><span class="muted" style="font-size: 14px">{{x.sc}}</span></div>
            <sc-if value="{{x.unlocked}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end"><button class="btn sec sm" onClick="{{x.read}}">Read</button><button class="btn pri sm" onClick="{{x.practice}}">Practice</button></div></sc-if>
            <sc-if value="{{x.locked}}" hint-placeholder-val="{{ false }}"><span class="muted" style="font-size: 13px">Pass step 4 first</span></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isScript}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter">
      <div style="display: flex; flex-direction: column; gap: 6px"><button class="btn sec sm" onClick="{{goBook}}" style="align-self: flex-start">{{bankName}}</button><h1 class="h1">{{scriptTitle}}</h1></div>
      <div class="row">
        <nav class="glass r28 c4" aria-label="Script steps" style="padding: 12px; display: flex; flex-direction: column; gap: 4px; align-self: start">
          <sc-for list="{{steps}}" as="p" hint-placeholder-count="5"><button class="{{p.cls}}" onClick="{{p.pick}}"><b>{{p.n}}</b>{{p.t}}</button></sc-for>
        </nav>
        <div class="c8" style="display: flex; flex-direction: column; gap: 16px">
          <section class="glass hi r28 card enter" style="padding: 30px">
            <span class="eyebrow">Step {{stepN}} · {{stepT}}</span>
            <span style="font-size: 13px; font-weight: 700; color: #1F7A2E">Agent says</span>
            <p style="margin: 0; font-size: 24px; line-height: 1.45; font-weight: 600">"{{stepAgent}}"</p>
            <div style="padding: 14px 18px; border-radius: 18px; background: rgba(253,227,184,.55); font-size: 15px"><b>Debtor cue:</b> {{stepCue}}</div>
            <span class="chip g" style="align-self: flex-start">Scored point: {{stepReq}}</span>
          </section>
          <div style="display: flex; gap: 10px; flex-wrap: wrap"><button class="btn sec" onClick="{{prevStep}}">Previous</button><button class="btn sec" onClick="{{nextStep}}">Next step</button><button class="btn pri" onClick="{{goHub}}">Practice this script</button></div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isHub}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter">
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="eyebrow">{{bankName}} · {{scriptTitle}}</span><h1 class="h1">How do you want to practice?</h1></div>
      <div class="row">
        <section class="glass hi r28 card c6" style="padding: 30px">
          <div class="av" style="background: #1F7A2E; color: #fff">2</div>
          <h2 class="h2" style="font-size: 24px">Duo role-play</h2>
          <p style="margin: 0" class="muted">You take the agent role. A teammate plays the debtor from the playbook brief. Both of you get scored.</p>
          <button class="btn pri" onClick="{{createLobby}}" style="align-self: flex-start">Create a lobby</button>
        </section>
        <section class="glass r28 card c6" style="padding: 30px">
          <div class="av">1</div>
          <h2 class="h2" style="font-size: 24px">Solo practice</h2>
          <p style="margin: 0" class="muted">Practice against recorded debtor audio. Good for a warm-up before a duo.</p>
          <button class="btn sec" onClick="{{goSolo}}" style="align-self: flex-start">Start solo</button>
        </section>
      </div>
      <section class="glass r28 card">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h2">Open lobbies on MC 7</h2><span class="muted" style="font-size: 13px">{{lobbyCount}} open</span></div>
        <div class="list"><sc-for list="{{lobbies}}" as="l" hint-placeholder-count="3"><div class="{{l.cls}}"><div class="av">{{l.ini}}</div><div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700">{{l.host}}</span><span class="muted" style="font-size: 13px">{{l.script}} · {{l.bank}}</span></div><span class="hide-m chip">{{l.state}}</span><sc-if value="{{l.open}}" hint-placeholder-val="{{ true }}"><button class="btn pri sm" onClick="{{l.join}}">Join</button></sc-if><sc-if value="{{l.busy}}" hint-placeholder-val="{{ false }}"><span class="muted" style="font-size: 13px">In call</span></sc-if></div></sc-for></div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{isLobby}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter" style="align-items: center; justify-content: center; gap: 36px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center"><span class="eyebrow">{{bankName}}</span><span style="font-size: 30px; font-weight: 800; letter-spacing: -.02em">{{scriptTitle}}</span></div>
      <div class="stage" style="display: flex; align-items: center">
        <div class="glass orb inL" style="width: 170px; height: 170px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 36px; font-weight: 800; color: #1F7A2E">RM</span><span style="font-size: 13px; font-weight: 600">You · agent</span></div>
        <div class="link" style="width: 120px; height: 3px; border-radius: 2px; background: {{linkBg}}; transition: background .5s"></div>
        <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><div class="glass orb inR" style="width: 170px; height: 170px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-size: 36px; font-weight: 800; color: #9A5A0E">JD</span><span style="font-size: 13px; font-weight: 600">Jomar · debtor</span></div></sc-if>
        <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}"><div class="orb float" style="width: 170px; height: 170px; border-radius: 50%; border: 2px dashed rgba(31,122,46,.35); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #4C6652">Waiting for partner</div></sc-if>
      </div>
      <section class="glass r28" style="padding: 18px 22px; max-width: 560px; font-size: 15px; text-align: center"><b>Debtor brief:</b> {{brief}}</section>
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><button class="btn pri pop" onClick="{{goLive}}" style="font-size: 17px; padding: 16px 34px">Start role-play</button></sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter" style="align-items: center; gap: 18px">

      history: hist, historyTop: hist.slice(0, 3),
      trend: this.TREND.map((v, i) => ({ w: 'W' + (i + 1), v: i === 5 && passed ? 84 : v, h: (i === 5 && passed ? 84 : v) + '%', cls: 'tb' + (i === 5 ? ' on' : ''), d: (i * 0.07) + 's' })),
      skills: this.SKILLS.map((k, i) => { const v = k.t === 'Offering options' && passed ? 66 : k.v; return { t: k.t, v, w: v + '%', d: (i * 0.1) + 's' }; }),
      missions: [ { t: 'Read a playbook script', p: '1/1', w: '100%', done: true }, { t: 'Pass a role-play', p: passed ? '1/1' : '0/1', w: passed ? '100%' : '0%', done: passed }, { t: 'Hit all 5 points', p: passed ? '5/5' : '3/5', w: passed ? '100%' : '60%', done: passed } ],
      board: [ { r: 1, n: 'Joy Santiago', s: '2,140', me: false }, { r: 2, n: 'Rica Manalo', s: passed ? '1,980' : '1,860', me: true }, { r: 3, n: 'Paolo Reyes', s: '1,720', me: false }, { r: 4, n: 'Ana Lopez', s: '1,610', me: false } ].map(b => ({ ...b, cls: 'lbr' + (b.me ? ' me' : '') }))
    };
  }
}
