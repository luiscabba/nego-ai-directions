<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 Game Show · Nego AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#FFD447}a:hover{color:#FFE48A}
@keyframes enter{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes slamL{from{transform:translateX(-120%) skewX(-8deg)}to{transform:skewX(-8deg)}}
@keyframes slamR{from{transform:translateX(120%) skewX(-8deg)}to{transform:skewX(-8deg)}}
@keyframes zoom{0%{transform:scale(3);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
@keyframes glowp{0%,100%{box-shadow:0 0 0 3px #FFD447,0 0 30px rgba(255,212,71,.5)}50%{box-shadow:0 0 0 3px #FFD447,0 0 60px rgba(255,212,71,.9)}}
@keyframes eq{0%,100%{transform:scaleY(.15)}50%{transform:scaleY(1)}}
@keyframes combo{0%{transform:translateY(20px) scale(.6);opacity:0}20%{transform:none;opacity:1}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes sweep{0%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}100%{transform:rotate(-18deg)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.enter{animation:enter .4s ease-out both}
.slamL{animation:slamL .55s cubic-bezier(.2,1.3,.4,1) both}.slamR{animation:slamR .55s cubic-bezier(.2,1.3,.4,1) both}
.zoom{animation:zoom .5s cubic-bezier(.2,1.2,.4,1) both}
.glowp{animation:glowp 1.4s ease-in-out infinite}
.eq{transform-origin:bottom;animation:eq .7s ease-in-out infinite}
.combo{animation:combo 1.5s ease-out both}
.sweep{transform-origin:top center;animation:sweep 7s ease-in-out infinite}
.fill{transform-origin:left;animation:fill .8s cubic-bezier(.2,1,.4,1) both}
@media (prefers-reduced-motion:reduce){.enter,.slamL,.slamR,.zoom,.glowp,.eq,.combo,.sweep,.fill{animation:none}}
</style>
<link rel="stylesheet" href="../mobile.css">
<style>
.dc-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(15,18,20,.82);backdrop-filter:blur(12px);font:600 12px/1 system-ui,sans-serif}
.dc-switch a{color:#E8ECEA;text-decoration:none;padding:8px 12px;border-radius:99px}
.dc-switch a:hover{background:rgba(255,255,255,.12)}
.dc-switch a[aria-current]{background:#E8ECEA;color:#111}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><div style="position: relative; overflow: hidden; min-height: 900px; background: #0B1320; font-family: 'Chakra Petch', system-ui, sans-serif; color: #F4F7FB; display: flex; flex-direction: column">
  <div class="sweep" aria-hidden="true" style="position: absolute; left: 18%; top: -80px; width: 260px; height: 1000px; background: linear-gradient(180deg, rgba(255,212,71,0.16), transparent 70%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%)"></div>
  <div class="sweep" aria-hidden="true" style="position: absolute; right: 18%; top: -80px; width: 260px; height: 1000px; background: linear-gradient(180deg, rgba(49,225,209,0.14), transparent 70%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); animation-delay: -3.5s"></div>

  <header style="position: relative; padding: 18px 36px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <button onClick="{{goHome}}" style="border: 0; background: transparent; font-family: 'Russo One', sans-serif; font-size: 26px; color: #FFD447; cursor: pointer; padding: 0; letter-spacing: 0.02em">NEGO!</button>
    <div style="display: flex; align-items: center; gap: 18px; font-weight: 700">
      <span style="color: #FF7A2F">STREAK {{streak}}</span>
      <div style="display: flex; align-items: center; gap: 8px"><span>LV 7</span><div style="width: 160px; height: 10px; background: #1C2A40; transform: skewX(-12deg); overflow: hidden"><div style="height: 10px; width: {{xp}}; background: #31E1D1; transition: width 1s"></div></div></div>
    </div>
  </header>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="enter" style="position: relative; flex: 1; padding: 20px 60px 50px; display: flex; flex-direction: column; gap: 30px">
      <h1 style="margin: 0; font-family: 'Russo One', sans-serif; font-weight: 400; font-size: 76px; line-height: 0.95; letter-spacing: -0.01em">PICK YOUR<br><span style="color: #FFD447">ROUND</span></h1>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px">
        <sc-for list="{{rounds}}" as="r" hint-placeholder-count="4">
          <button class="{{r.cls}}" onClick="{{goLobby}}" style="text-align: left; border: 0; cursor: pointer; padding: 26px 24px; min-height: 260px; background: {{r.bg}}; color: {{r.fg}}; transform: skewX(-6deg); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; font-family: inherit">
            <span style="font-weight: 700; font-size: 14px; transform: skewX(6deg)">{{r.tag}}</span>
            <span style="font-family: 'Russo One', sans-serif; font-size: 28px; line-height: 1.05; transform: skewX(6deg)">{{r.t}}</span>
            <span style="font-weight: 700; font-size: 15px; transform: skewX(6deg)">{{r.stars}} · {{r.b}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isLobby}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 0; padding: 40px">
      <div class="slamL" style="width: 460px; height: 420px; background: #FF7A2F; display: flex; flex-direction: column; justify-content: flex-end; padding: 34px; box-sizing: border-box">
        <div style="transform: skewX(8deg); display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Russo One', sans-serif; font-size: 120px; line-height: 0.85; color: #0B1320">RM</span><span style="font-weight: 700; font-size: 22px; color: #0B1320">RICA · AGENT</span></div>
      </div>
      <div style="position: relative; z-index: 2; width: 110px; height: 110px; margin: 0 -40px; border-radius: 50%; background: #0B1320; border: 4px solid #FFD447; display: flex; align-items: center; justify-content: center; font-family: 'Russo One', sans-serif; font-size: 42px; color: #FFD447">&amp;</div>
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
        <div class="slamR" style="width: 460px; height: 420px; background: #31E1D1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 34px; box-sizing: border-box">
          <div style="transform: skewX(8deg); display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-family: 'Russo One', sans-serif; font-size: 120px; line-height: 0.85; color: #0B1320">JD</span><span style="font-weight: 700; font-size: 22px; color: #0B1320">JOMAR · DEBTOR</span></div>
        </div>
      </sc-if>
      <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
        <div style="width: 460px; height: 420px; border: 3px dashed #2A3B57; transform: skewX(-8deg); display: flex; align-items: center; justify-content: center"><span style="transform: skewX(8deg); font-weight: 700; font-size: 22px; color: #6E7F9A">WAITING FOR PLAYER 2</span></div>
      </sc-if>
      <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
        <button class="zoom" onClick="{{goLive}}" style="position: absolute; bottom: 60px; left: 50%; margin-left: -150px; width: 300px; padding: 18px 0; border: 0; background: #FFD447; color: #0B1320; font-family: 'Russo One', sans-serif; font-size: 28px; transform: skewX(-8deg); cursor: pointer">START ROUND</button>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; flex: 1; display: flex; flex-direction: column; padding: 10px 36px 30px; gap: 20px">
      <div style="display: grid; grid-template-columns: 1fr 140px 1fr; gap: 20px; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 700; color: #FF7A2F">POINTS · RICA</span><div style="display: flex; gap: 6px"><sc-for list="{{pts}}" as="p" hint-placeholder-count="5"><div style="flex: 1; height: 22px; transform: skewX(-14deg); background: {{p.seg}}; transition: background .3s"></div></sc-for></div></div>
        <div style="height: 110px; border: 4px solid #FFD447; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: skewX(-8deg)"><span style="font-family: 'Russo One', sans-serif; font-size: 38px; transform: skewX(8deg); font-variant-numeric: tabular-nums">{{clock}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end"><span style="font-weight: 700; color: #31E1D1">COMMITMENT · JOMAR</span><div style="width: 100%; height: 22px; transform: skewX(14deg); background: #1C2A40; overflow: hidden; display: flex; justify-content: flex-end"><div style="height: 22px; width: {{commit}}; background: #31E1D1; transition: width .6s"></div></div></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center">
        <sc-if value="{{hasCombo}}" hint-placeholder-val="{{ false }}"><span class="combo" style="font-family: 'Russo One', sans-serif; font-size: 40px; color: #FFD447">+ {{comboText}}</span></sc-if>
        <span style="font-size: 20px; color: #9FD8D2; max-width: 50ch">{{debtorLine}}</span>
        <p style="margin: 0; max-width: 24ch; font-family: 'Russo One', sans-serif; font-size: 46px; line-height: 1.2"><span>{{said}}</span> <span style="color: #3A4B66">{{rest}}</span></p>
        <span style="font-weight: 700; font-size: 15px; color: #FF7A2F">{{nowLabel}}</span>
      </div>
      <div style="display: flex; gap: 4px; align-items: flex-end; height: 60px" aria-hidden="true"><sc-for list="{{eq}}" as="e" hint-placeholder-count="64"><div class="eq" style="flex: 1; height: {{e.h}}; background: {{e.c}}; animation-delay: {{e.d}}"></div></sc-for></div>
    </div>
  </sc-if>

  <sc-if value="{{isResults}}" hint-placeholder-val="{{ false }}">
    <div style="position: relative; flex: 1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 30px; padding: 20px 60px 50px; align-items: center">
      <div style="grid-column: span 6; display: flex; flex-direction: column; gap: 20px">
        <h1 class="zoom" style="margin: 0; font-family: 'Russo One', sans-serif; font-weight: 400; font-size: 96px; line-height: 0.9; color: #FFD447">ROUND<br>CLEAR!</h1>
        <div style="display: flex; gap: 12px; flex-wrap: wrap">
          <sc-for list="{{rewards}}" as="w" hint-placeholder-count="3"><span class="zoom" style="padding: 10px 18px; background: {{w.bg}}; color: #0B1320; font-weight: 700; font-size: 16px; transform: skewX(-8deg); animation-delay: {{w.d}}">{{w.t}}</span></sc-for>
        </div>
        <div style="display: flex; gap: 12px"><button onClick="{{goHome}}" style="padding: 16px 28px; border: 0; background: #FFD447; color: #0B1320; font-family: 'Russo One', sans-serif; font-size: 20px; transform: skewX(-8deg); cursor: pointer">NEXT ROUND</button><button onClick="{{goLive}}" style="padding: 16px 24px; border: 3px solid #F4F7FB; background: transparent; color: #F4F7FB; font-family: 'Russo One', sans-serif; font-size: 20px; transform: skewX(-8deg); cursor: pointer">REPLAY</button></div>
      </div>
      <div style="grid-column: span 6; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; align-items: center; gap: 24px"><div style="width: 150px; height: 150px; border-radius: 50%; border: 6px solid #FF7A2F; display: flex; align-items: center; justify-content: center; font-family: 'Russo One', sans-serif; font-size: 90px; color: #FF7A2F">{{grade}}</div><div style="display: flex; flex-direction: column"><span style="font-family: 'Russo One', sans-serif; font-size: 80px; line-height: 1; font-variant-numeric: tabular-nums">{{score}}</span><span style="font-weight: 700; color: #6E7F9A">SCORE / 100</span></div></div>
        <sc-for list="{{crit}}" as="c" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-weight: 700"><span>{{c.t}}</span><span>{{c.v}}</span></div><div style="height: 16px; background: #1C2A40; transform: skewX(-14deg); overflow: hidden"><div class="fill" style="height: 16px; width: {{c.w}}; background: {{c.c}}; animation-delay: {{c.d}}"></div></div></div></sc-for>
      </div>
    </div>
  </sc-if>
</div></template>
<script id="logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.POINTS = [
      { t: 'Verify identity', at: 2 }, { t: 'Confirm PTP', at: 5 }, { t: 'Probe ability to pay', at: 10 },
      { t: 'Offer partial', at: 14 }, { t: 'Recap and close', at: 18 }
    ];
    this.LINES = [
      { at: 0, who: 'a', text: 'Magandang hapon po, si Rica po ito ng Amihan Bank. Si Mr. Jomar Dizon po ba ito?' },
      { at: 2, who: 'd', text: 'Oo, ako nga. Ano yun?' },
      { at: 3, who: 'a', text: 'I-confirm ko lang po ang ₱12,000 natin sa 25 Oct.' },
      { at: 6, who: 'd', text: 'Medyo mahirap ngayon. Nawalan ako ng sideline.' },
      { at: 8, who: 'a', text: 'Naiintindihan ko po. Ano po ang pinagkukunan natin ng pambayad ngayong buwan?' },
      { at: 11, who: 'd', text: 'Baka kalahati lang kaya ko sa 25.' },
      { at: 12, who: 'a', text: 'Pwede po nating hatiin: ₱6,000 sa 25 Oct at ₱6,000 sa 8 Nov.' },
      { at: 15, who: 'd', text: 'Sige, kaya ko yun.' },
      { at: 16, who: 'a', text: 'Recap po: ₱6,000 sa 25 Oct, ₱6,000 sa 8 Nov. Salamat po, Mr. Dizon.' }
    ];
    this.state = { screen: 'home', tick: 0, ready: false, score: 0 };
  }
  componentWillUnmount() { this.stop(); }
  stop() { if (this.iv) { clearInterval(this.iv); this.iv = null; } if (this.to) { clearTimeout(this.to); this.to = null; } }
  go(screen) {
    this.stop();
    this.setState({ screen, tick: 0, ready: false, score: 0 });
    if (screen === 'lobby') this.to = setTimeout(() => this.setState({ ready: true }), 1600);
    if (screen === 'live') this.iv = setInterval(() => { const t = this.state.tick + 1; if (t > 20) { this.go('results'); return; } this.setState({ tick: t }); }, 750);
    if (screen === 'results') this.iv = setInterval(() => { const s = Math.min(84, this.state.score + 2); this.setState({ score: s }); if (s >= 84) this.stop(); }, 25);
  }
  renderVals() {
    const s = this.state, t = s.tick;
    const fmt = x => String(Math.floor(x / 60)).padStart(1, '0') + ':' + String(x % 60).padStart(2, '0');
    const pts = this.POINTS.map((p, i) => {
      const m = t > p.at, n = !m && (i === 0 || t > this.POINTS[i - 1].at);
      return { ...p, met: m, now: n, seg: m ? '#FF7A2F' : n ? '#7A3A1A' : '#1C2A40' };
    });
    const metN = pts.filter(p => p.met).length;
    const recent = this.POINTS.find(p => t > p.at && t - p.at <= 2);
    const cur = pts.find(p => p.now);
    const vis = this.LINES.filter(l => l.at <= t);
    const lastA = [...vis].reverse().find(l => l.who === 'a') || this.LINES[0];
    const lastD = [...vis].reverse().find(l => l.who === 'd');
    const words = lastA.text.split(' ');
    const n = Math.min(words.length, (t - lastA.at) * 5 + 4);
    const scr = s.screen, won = scr === 'results' && s.score >= 84;
    const eqH = Array.from({ length: 64 }, (_, i) => 12 + Math.round(Math.abs(Math.sin(i * 0.7) * Math.cos(i * 0.23)) * 48));
    return {
      isHome: scr === 'home', isLobby: scr === 'lobby', isLive: scr === 'live', isResults: scr === 'results',
      ready: s.ready, notReady: !s.ready,
      goHome: () => this.go('home'), goLobby: () => this.go('lobby'), goLive: () => this.go('live'),
      streak: won ? 6 : 5, xp: won ? '86%' : '62%',
      rounds: [
        { t: 'Affordable Partial Payment', tag: 'TL PICK · TICKET', stars: '★★★', b: 'AMIHAN', bg: '#FFD447', fg: '#0B1320', cls: 'glowp' },
        { t: 'Payment Commitment Check-in', tag: 'NEXT UP', stars: '★★', b: 'AMIHAN', bg: '#FF7A2F', fg: '#0B1320', cls: '' },
        { t: 'Refusal to Pay', tag: 'NEW', stars: '★★★★', b: 'HARBOR', bg: '#31E1D1', fg: '#0B1320', cls: '' },
        { t: 'Settlement Negotiation', tag: 'BOSS ROUND', stars: '★★★★★', b: 'BAYANIHAN', bg: '#1C2A40', fg: '#F4F7FB', cls: '' }
      ],
      pts, commit: (metN * 20) + '%',
      hasCombo: !!recent, comboText: recent ? recent.t.toUpperCase() : '',
      nowLabel: cur ? 'NOW · ' + cur.t.toUpperCase() : 'ALL POINTS HIT',
      debtorLine: lastD ? 'Jomar: ' + lastD.text : 'Jomar is listening',
      said: words.slice(0, n).join(' '), rest: words.slice(n).join(' '),
      clock: fmt(t * 16),
      eq: eqH.map((h, i) => ({ h: h + 'px', d: (i * 0.03) + 's', c: i % 3 === 0 ? '#FF7A2F' : i % 3 === 1 ? '#FFD447' : '#31E1D1' })),
      score: s.score, grade: s.score >= 84 ? 'A' : s.score >= 70 ? 'B' : 'C',
      rewards: [ { t: '+120 XP', bg: '#31E1D1', d: '.2s' }, { t: 'STREAK 6', bg: '#FF7A2F', d: '.35s' }, { t: 'TICKET CLOSED', bg: '#FFD447', d: '.5s' } ],
      crit: [ { t: 'SCRIPT ACCURACY', v: '44/50', w: '88%', c: '#FF7A2F', d: '.1s' }, { t: 'VOICE AND TONE', v: '24/30', w: '80%', c: '#FFD447', d: '.3s' }, { t: 'NEGOTIATION', v: '16/20', w: '80%', c: '#31E1D1', d: '.5s' } ]
    };
  }
}
</script>

<script>
if (window.self !== window.top) document.querySelector('.dc-switch').hidden = true;
DCRuntime.mount(document.getElementById('app'), document.getElementById('tpl'), document.getElementById('logic').textContent);
</script>
