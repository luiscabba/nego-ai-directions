<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5+ Glass Console App · Nego AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#7FE3C0}a:hover{color:#B3F0DA}
.gc{position:relative;overflow:hidden;min-height:900px;font-family:Sora,system-ui,sans-serif;color:#E6F0EE;background:#0A1012;display:flex}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.g{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.28);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%)}
.g.hi{background:rgba(255,255,255,.09);border-color:rgba(127,227,192,.38)}
.r24{border-radius:24px}.r18{border-radius:18px}
.mono{font-family:'JetBrains Mono',monospace}
.lbl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:#9FB3AF;text-transform:uppercase}
.muted{color:#9FB3AF}
.rail{position:relative;flex:0 0 88px;margin:20px 0 20px 20px;border-radius:26px;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2}
.nav{width:72px;border:0;background:transparent;color:#9FB3AF;font:inherit;font-size:11px;font-weight:500;padding:10px 0;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.nav svg{width:20px;height:20px}
.nav.on{background:rgba(127,227,192,.14);color:#7FE3C0}
.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 28px 0;flex-wrap:wrap}
.scr{flex:1;padding:20px 28px 40px;display:flex;flex-direction:column;gap:18px}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.card{padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.h1{margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.h2{margin:0;font-size:15px;font-weight:600}
.btn{border:0;font:inherit;font-weight:600;font-size:14px;padding:13px 22px;border-radius:99px;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(140deg,#7FE3C0,#3FB68B);color:#06231A;box-shadow:0 10px 30px rgba(63,182,139,.32)}
.btn.sec{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E6F0EE}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.end{background:#D9503A;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.chip.ok{background:rgba(127,227,192,.14);border-color:rgba(127,227,192,.3);color:#7FE3C0}
.chip.amb{background:rgba(242,194,135,.12);border-color:rgba(242,194,135,.3);color:#F2C287}
.trow{display:grid;grid-template-columns:1fr 130px 90px 170px;gap:12px;align-items:center;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.035)}
.trow:hover{background:rgba(255,255,255,.07)}
.st{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.06);color:#9FB3AF;justify-self:start}
.st.passed{background:rgba(127,227,192,.14);color:#7FE3C0}.st.ticket{background:rgba(242,194,135,.14);color:#F2C287}.st.progress{background:rgba(110,150,240,.18);color:#A9C1FF}.st.locked{opacity:.5}
.bk{text-align:left;width:100%;border:1px solid transparent;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:14px 16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bk:hover{background:rgba(255,255,255,.05)}
.bk.on{background:rgba(127,227,192,.1);border-color:rgba(127,227,192,.3)}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;border:0;background:transparent;font:inherit;color:#7C918D;text-align:left;cursor:pointer;padding:10px 12px;border-radius:14px}
.step b{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:12px}
.step.on{color:#E6F0EE;background:rgba(127,227,192,.1)}
.step.on b{color:#7FE3C0}
.pt{display:flex;justify-content:space-between;gap:10px;padding:13px 16px;border-radius:16px;font-size:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:background .4s,border-color .4s}
.pt.met{background:rgba(127,227,192,.12);border-color:rgba(127,227,192,.25)}
.pt.now{background:rgba(255,255,255,.1);border-color:rgba(127,227,192,.6)}
.pt.todo{color:#7C918D}
.pt span:last-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7FE3C0}
.lb{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.035)}
.lb.Ongoing{opacity:.55}
.av{width:44px;height:44px;border-radius:50%;background:rgba(127,227,192,.14);border:1px solid rgba(127,227,192,.3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#7FE3C0;flex:none}
.tab{border:0;font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:99px;background:transparent;color:#9FB3AF;cursor:pointer}
.tab.on{background:rgba(255,255,255,.12);color:#fff}
.ln{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:14px;line-height:1.55}
.ln.a .who{color:#7FE3C0}.ln.d .who{color:#F2C287}
.mk{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 12px currentColor}
.mk.met{background:#7FE3C0;color:#7FE3C0}.mk.late{background:#F2C287;color:#F2C287}
.tb{flex:1;border-radius:8px 8px 2px 2px;background:rgba(255,255,255,.14)}
.tb.on{background:linear-gradient(180deg,#7FE3C0,#2A9D7C);box-shadow:0 0 24px rgba(127,227,192,.35)}
.hs{display:grid;grid-template-columns:1fr 120px 60px;gap:12px;align-items:center;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.035);font-size:14px}
.hs .sc{font-family:'JetBrains Mono',monospace;font-size:15px;text-align:right}
.hs.pass .sc{color:#7FE3C0}.hs.miss .sc{color:#F2C287}
.ring{border-radius:50%;display:flex;align-items:center;justify-content:center;transition:box-shadow .4s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,50px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,70px)}}
@keyframes bar{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(127,227,192,.5)}100%{box-shadow:0 0 0 26px rgba(127,227,192,0)}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
.enter{animation:enter .6s cubic-bezier(.16,1,.3,1) both}
.b1{animation:drift1 16s ease-in-out infinite}.b2{animation:drift2 20s ease-in-out infinite}
.bar{transform-origin:center;animation:bar .9s ease-in-out infinite}
.grow{transform-origin:left;animation:grow .9s cubic-bezier(.16,1,.3,1) both}
.rise{transform-origin:bottom;animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.pop{animation:pop .5s cubic-bezier(.16,1,.3,1) both}
.halo{animation:halo 1.4s ease-out infinite}
.slide{animation:slide .4s ease-out both}
.scan{animation:scan 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.enter,.b1,.b2,.bar,.grow,.rise,.pop,.halo,.slide,.scan{animation:none}}
@media (max-width:760px){
.gc{flex-direction:column}
.rail .hide-m{display:none !important}
.rail{flex:none;flex-direction:row;justify-content:space-around;margin:0;position:fixed;left:8px;right:8px;bottom:8px;border-radius:22px;padding:6px;z-index:40}
.nav{width:auto;flex:1;padding:8px 0}
.top{padding:56px 16px 0}
.scr{padding:16px 16px 100px}
.row{display:flex;flex-direction:column;gap:14px}
.h1{font-size:26px}
.card{padding:18px}
.trow{grid-template-columns:1fr auto}.trow .hide-m{display:none}
.lb{grid-template-columns:40px 1fr auto}.lb .hide-m{display:none}
.hs{grid-template-columns:1fr 50px}.hs .hide-m{display:none}
.stage{padding:20px !important;gap:10px !important}
.stage .ring{width:76px !important;height:76px !important;font-size:20px !important}
.stage .wv{height:50px !important}
.prompt{font-size:22px !important}
.bigring{width:170px !important;height:170px !important}.bigring>div{width:140px !important;height:140px !important}
}
</style>
<link rel="stylesheet" href="../mobile.css">
<style>
.dc-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(15,18,20,.82);backdrop-filter:blur(12px);font:600 12px/1 system-ui,sans-serif}
.dc-switch a{color:#E8ECEA;text-decoration:none;padding:8px 12px;border-radius:99px}
.dc-switch a:hover{background:rgba(255,255,255,.12)}
.dc-switch a[aria-current]{background:#E8ECEA;color:#111}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><div class="gc">
  <div class="blob b1" aria-hidden="true" style="left: -160px; top: -120px; width: 820px; height: 620px; background: radial-gradient(closest-side, rgba(38,160,128,.48), transparent)"></div>
  <div class="blob b2" aria-hidden="true" style="right: -160px; top: 60px; width: 760px; height: 580px; background: radial-gradient(closest-side, rgba(46,86,170,.42), transparent)"></div>
  <div class="blob b1" aria-hidden="true" style="left: 35%; bottom: -300px; width: 640px; height: 520px; background: radial-gradient(closest-side, rgba(214,140,50,.24), transparent)"></div>

  <nav class="rail g" aria-label="Main">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(140deg, #5FE0B4, #2A9D7C); color: #06231A; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 12px" class="hide-m">N</div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <button class="{{n.cls}}" onClick="{{n.go}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.t}}</button>
    </sc-for>
  </nav>

  <div class="main">
    <header class="top">
      <div style="display: flex; align-items: center; gap: 12px"><span class="chip ok">{{statusLabel}}</span><span class="muted" style="font-size: 14px">Rica Manalo · MC 7</span></div>
      <sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">
        <div class="g" style="display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 99px"><span class="mono" style="display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: 12px; color: #F59C86"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F0705A"></span>REC {{clock}}</span><button class="btn end sm" onClick="{{goResults}}">End</button></div>
      </sc-if>
      <sc-if value="{{notLive}}" hint-placeholder-val="{{ true }}">
        <div class="mono" style="display: flex; gap: 22px; font-size: 13px"><span><span class="muted">streak </span>{{streak}}</span><span><span class="muted">pass </span>{{passRate}}</span><span><span class="muted">avg </span>{{avg}}</span></div>
      </sc-if>
    </header>

    <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
      <div class="scr enter">
        <div class="row">
          <section class="g hi r24 card c7" style="padding: 30px; gap: 16px">
            <div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap"><span class="chip amb">Coaching ticket · Major</span><span class="lbl">QA AI · 16 Oct</span></div>
            <h1 class="h1" style="font-size: 38px">{{scriptTitle}}</h1>
            <p style="margin: 0; font-size: 15px; color: #C3D2CF; max-width: 52ch">3 live calls this week with no partial offered after a hardship claim. Pass this once to close the ticket.</p>
            <div style="display: flex; gap: 10px; flex-wrap: wrap"><button class="btn pri" onClick="{{createLobby}}">Start duo</button><button class="btn sec" onClick="{{goSolo}}">Solo first</button><button class="btn sec" onClick="{{readCurrent}}">Read script</button></div>
          </section>
          <section class="g r24 card c5">
            <div style="display: flex; justify-content: space-between"><h2 class="h2">Last 6 scores</h2><span class="lbl">pass 80</span></div>
            <div style="position: relative; display: flex; gap: 10px; align-items: flex-end; height: 140px"><div style="position: absolute; left: 0; right: 0; bottom: 80%; border-top: 1px dashed rgba(127,227,192,.6)"></div><sc-for list="{{lastSix}}" as="x" hint-placeholder-count="6"><div class="{{x.cls}} rise" style="height: {{x.h}}; animation-delay: {{x.d}}"></div></sc-for></div>
            <div style="display: flex; gap: 10px"><sc-for list="{{lastSix}}" as="x" hint-placeholder-count="6"><span class="mono" style="flex: 1; text-align: center; font-size: 11px; color: #C3D2CF">{{x.v}}</span></sc-for></div>
          </section>
        </div>
        <section class="g r24 card">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h2">Practice queue · {{bankName}}</h2><button class="btn sec sm" onClick="{{goBooks}}">All playbooks</button></div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{queue}}" as="x" hint-placeholder-count="4"><div class="trow slide" style="animation-delay: {{x.d}}"><div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600; font-size: 14px">{{x.t}}</span><span class="muted" style="font-size: 12px">{{x.sc}}</span></div><span class="{{x.cls}} hide-m">{{x.label}}</span><span class="mono hide-m muted" style="font-size: 12px">{{x.min}} min</span><div style="display: flex; gap: 6px; justify-content: flex-end"><button class="btn sec sm" onClick="{{x.read}}">Read</button><button class="btn pri sm" onClick="{{x.practice}}">Start</button></div></div></sc-for>
          </div>
        </section>
      </div>
    </sc-if>

    <sc-if value="{{isLibrary}}" hint-placeholder-val="{{ false }}">
      <div class="scr enter">
        <h1 class="h1">Playbooks</h1>
        <div class="row">
          <section class="g r24 c4" style="padding: 10px; display: flex; flex-direction: column; gap: 4px; align-self: start">
            <sc-for list="{{banks}}" as="b" hint-placeholder-count="4"><button class="{{b.cls}}" onClick="{{b.open}}"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{b.name}}</span><span class="muted" style="font-size: 12px">TL {{b.tl}}</span></div><span class="mono" style="font-size: 12px; color: #7FE3C0">{{b.label}}</span></button></sc-for>
          </section>
          <section class="g r24 card c8">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap"><h2 class="h2" style="font-size: 18px">{{bankName}}</h2><span class="lbl">{{bankDone}} of {{bankTotal}} passed</span></div>
            <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden"><div class="grow" style="height: 6px; width: {{bankPct}}; background: linear-gradient(90deg, #7FE3C0, #2A9D7C)"></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{scripts}}" as="x" hint-placeholder-count="5"><div class="trow slide" style="animation-delay: {{x.d}}"><div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600; font-size: 14px">{{x.n}}. {{x.t}}</span><span class="muted" style="font-size: 12px">{{x.sc}}</span></div><span class="{{x.cls}} hide-m">{{x.label}}</span><span class="mono hide-m muted" style="font-size: 12px">{{x.min}} min</span><div style="display: flex; gap: 6px; justify-content: flex-end"><sc-if value="{{x.unlocked}}" hint-placeholder-val="{{ true }}"><button class="btn sec sm" onClick="{{x.read}}">Read</button><button class="btn pri sm" onClick="{{x.practice}}">Start</button></sc-if><sc-if value="{{x.locked}}" hint-placeholder-val="{{ false }}"><span class="lbl">locked</span></sc-if></div></div></sc-for>
            </div>
          </section>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isScript}}" hint-placeholder-val="{{ false }}">
      <div class="scr enter">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap"><div style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">{{bankName}}</span><h1 class="h1">{{scriptTitle}}</h1></div><button class="btn pri" onClick="{{goHub}}">Practice this</button></div>
        <div class="row">
          <nav class="g r24 c3" aria-label="Script steps" style="padding: 10px; display: flex; flex-direction: column; gap: 2px; align-self: start"><sc-for list="{{steps}}" as="p" hint-placeholder-count="5"><button class="{{p.cls}}" onClick="{{p.pick}}"><b>0{{p.n}}</b><span>{{p.t}}</span></button></sc-for></nav>
          <section class="g hi r24 card c9" style="padding: 34px; gap: 20px; position: relative; overflow: hidden">
            <div style="position: absolute; left: 0; top: 0; height: 2px; width: 25%; background: linear-gradient(90deg, transparent, #7FE3C0, transparent)" class="scan" aria-hidden="true"></div>
            <span class="lbl" style="color: #7FE3C0">Step 0{{stepN}} · {{stepT}}</span>
            <p class="prompt" style="margin: 0; font-size: 30px; line-height: 1.45; font-weight: 500">{{stepAgent}}</p>
            <div class="row" style="gap: 14px">
              <div class="c7 g r18" style="padding: 16px 18px; background: rgba(242,194,135,.08); border-color: rgba(242,194,135,.22)"><span class="lbl" style="color: #F2C287">Debtor cue</span><div style="margin-top: 6px; font-size: 14px; color: #F2D3A8">{{stepCue}}</div></div>
              <div class="c5 g r18" style="padding: 16px 18px"><span class="lbl">Scored point</span><div style="margin-top: 6px; font-size: 14px; color: #7FE3C0">{{stepReq}}</div></div>
            </div>
            <div style="display: flex; gap: 8px"><button class="btn sec sm" onClick="{{prevStep}}">Previous</button><button class="btn sec sm" onClick="{{nextStep}}">Next</button></div>
          </section>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isHub}}" hint-placeholder-val="{{ false }}">
      <div class="scr enter">
        <h1 class="h1">Role play</h1>
        <div class="row">
          <section class="g r24 card c7">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap"><h2 class="h2">Find a lobby</h2><div style="display: flex; gap: 6px"><span class="chip ok">All</span><span class="chip">Open</span><span class="chip">Ongoing</span></div></div>
            <div style="display: flex; flex-direction: column; gap: 6px"><sc-for list="{{lobbies}}" as="l" hint-placeholder-count="3"><div class="{{l.cls}} slide"><div class="av">{{l.ini}}</div><div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600; font-size: 14px">{{l.host}}</span><span class="muted" style="font-size: 12px">{{l.script}} · {{l.bank}}</span></div><span class="chip hide-m">{{l.state}}</span><sc-if value="{{l.open}}" hint-placeholder-val="{{ true }}"><button class="btn pri sm" onClick="{{l.join}}">Join</button></sc-if><sc-if value="{{l.busy}}" hint-placeholder-val="{{ false }}"><span class="lbl">in call</span></sc-if></div></sc-for></div>
          </section>
          <section class="g hi r24 card c5">
            <h2 class="h2">Create a lobby</h2>
            <div class="g r18" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span class="lbl">Playbook</span><span style="font-size: 14px">{{bankName}}</span></div>
            <div class="g r18" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span class="lbl">Script</span><span style="font-size: 14px">{{scriptTitle}}</span></div>
            <span class="muted" style="font-size: 13px">You take the agent role. Your partner plays the debtor from the playbook brief.</span>
            <div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn pri" onClick="{{createLobby}}">Create lobby</button><button class="btn sec" onClick="{{goSolo}}">Solo with recorded audio</button></div>
          </section>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isLobby}}" hint-placeholder-val="{{ false }}">
      <div class="scr enter" style="align-items: center; justify-content: center; gap: 30px">
        <div style="display: flex; align-items: center">
          <div class="ring halo" style="width: 130px; height: 130px; background: rgba(127,227,192,.14); border: 1px solid rgba(127,227,192,.4); font-size: 32px; font-weight: 600; color: #7FE3C0">RM</div>
          <div style="width: 160px; height: 2px; background: rgba(255,255,255,.1); overflow: hidden"><sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><div class="grow" style="height: 2px; background: linear-gradient(90deg, #7FE3C0, #F2C287)"></div></sc-if></div>
          <div class="ring" style="width: 130px; height: 130px; background: {{dBg}}; border: 1px solid {{dBd}}; font-size: 32px; font-weight: 600; color: #F2C287; transition: background .5s, border-color .5s">JD</div>
        </div>

      aCol: aTalk ? '#7FE3C0' : '#6F827E', dCol: aTalk ? '#6F827E' : '#F2C287', waveCol: aTalk ? '#7FE3C0' : '#F2C287',
      wave: wave.map((h, i) => ({ h: Math.round(h / 64 * 100) + '%', d: (i * 0.04) + 's' })),
      debtorName: solo ? 'Recorded' : 'Jomar', debtorLine: lastD ? lastD.text : '', hasDebtor: !!lastD,
      pts, metCount, nowLabel: cur ? 'Step 0' + (pts.indexOf(cur) + 1) + ' · ' + cur.t : 'All points met',
      said: words.slice(0, n).join(' '), rest: words.slice(n).join(' '), clock: fmt(t * 16),
      score: s.score, done: s.score >= 84, scoreRing: 'conic-gradient(#7FE3C0 ' + (s.score * 3.6) + 'deg, rgba(255,255,255,.08) 0deg)',
      crit: [ { t: 'Script accuracy', v: '44/50', w: '88%', d: '.1s' }, { t: 'Voice and tone', v: '24/30', w: '80%', d: '.3s' }, { t: 'Negotiation', v: '16/20', w: '80%', d: '.5s' } ],
      metrics: [ { t: 'Pace', v: '128 wpm', note: 'Good pace' }, { t: 'Filler words', v: '5%', note: 'Low' }, { t: 'Talk time', v: '58%', note: 'Balanced' } ],
      segments: segs,
      moments: this.STEPS.map((p, i) => ({ time: fmt(p.at * 16), t: p.req, q: '"' + p.agent.split(' ').slice(0, 6).join(' ') + '..."', tag: i === 3 ? 'late' : 'met', tagCls: 'st ' + (i === 3 ? 'ticket' : 'passed'), cls: 'mk ' + (i === 3 ? 'late' : 'met'), left: Math.round(p.at / 20 * 100) + '%' })),
      transcript: this.LINES.map(l => ({ ts: fmt(l.at * 16), who: l.who === 'a' ? 'Rica' : (solo ? 'Recorded' : 'Jomar'), cls: 'ln ' + l.who, text: l.text })),
      history: hist,
      trend: this.TREND.map((v, i) => { const x = i === 5 && passed ? 82 : v; return { w: 'W' + (i + 1), v: x, h: x + '%', cls: 'tb' + (i === 5 ? ' on' : ''), d: (i * 0.07) + 's' }; }),
      skills: this.SKILLS.map((k, i) => { const v = k.t === 'Offering options' && passed ? 66 : k.v; return { t: k.t, v, w: v + '%', d: (i * 0.1) + 's' }; })
    };
  }
}
