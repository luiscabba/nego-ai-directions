<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nego AI Directions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F3F4F2;--card:#FFFFFF;--ink:#16191A;--muted:#5E6664;--line:#E1E4E0}
@media (prefers-color-scheme:dark){:root{--bg:#111415;--card:#1A1E1F;--ink:#E8ECEA;--muted:#98A29F;--line:#2A3032}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:40px max(20px,env(safe-area-inset-left)) 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:15px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:22px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000}
.thumb iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.name{font-weight:600;font-size:16px}
.num{font-family:'Geist Mono',monospace;font-size:12px;color:var(--muted)}
.tags{font-size:13px;color:var(--muted)}
.open{font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Nego AI Directions</h1><div class="sub">Same role-play flow in six styles: Home, Lobby, Live, Results.</div></div>
    <span class="num">S.P. Madrid · Oct 2026</span>
  </header>
  <div class="grid" id="grid"></div>
</div>
<script>
const flows = [
  ['practice-path', '2', 'Practice Path', 'Flat · learning path · chunky buttons'],
  ['call-floor', '3', 'Call Floor', 'Dark console · dense · softphone'],
  ['glass-path', '4', 'Glass Path', 'Light glass · chat bubbles'],
  ['glass-console', '5', 'Glass Console', 'Dark glass · speaker rings'],
  ['collection-slip', '8', 'Collection Slip', 'Paper slips · stamps · receipt tape'],
  ['game-show', '9', 'Game Show', 'Broadcast HUD · loud type']
];
const grid = document.getElementById('grid');
grid.innerHTML = flows.map(([slug, n, name, tags]) => `
  <a class="card" href="flows/${slug}.html">
    <div class="thumb"><iframe src="flows/${slug}.html" title="${name} preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>
    <div class="meta"><div><div class="name"><span class="num">${n}</span> ${name}</div><div class="tags">${tags}</div></div><span class="open">Open flow</span></div>
  </a>`).join('');
const fit = () => document.querySelectorAll('.thumb').forEach(t => { t.querySelector('iframe').style.transform = `scale(${t.clientWidth / 1440})`; });
addEventListener('resize', fit); fit();
</script>
</body>
</html>
