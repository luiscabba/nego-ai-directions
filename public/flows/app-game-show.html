<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9+ Game Show App · Nego AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFDD7A}
.gs{position:relative;overflow:hidden;min-height:900px;font-family:'Chakra Petch',system-ui,sans-serif;color:#F2F5FF;background:radial-gradient(1200px 520px at 50% -120px,rgba(255,170,60,.22),transparent 70%),radial-gradient(900px 600px at 100% 100%,rgba(47,224,208,.10),transparent 70%),#070C1C;display:flex;flex-direction:column}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px;pointer-events:none;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.beam{position:absolute;top:-60px;width:300px;height:1000px;pointer-events:none;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:top center}
.pnl{position:relative;background:linear-gradient(180deg,#141D3A,#0D142C);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.06);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.pnl.glow{border:2px solid transparent;background:linear-gradient(180deg,#17224A,#0E1633) padding-box,linear-gradient(135deg,#FFC93C,#FF6A3D 50%,#2FE0D0) border-box;box-shadow:none}
.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.scr{position:relative;flex:1;padding:24px 40px 48px;display:flex;flex-direction:column;gap:22px;max-width:1380px;width:100%;box-sizing:border-box;margin:0 auto}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.card{padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.disp{font-family:'Russo One',sans-serif;font-weight:400;letter-spacing:.005em}
.h1{margin:0;font-family:'Russo One',sans-serif;font-weight:400;font-size:52px;line-height:1;text-wrap:balance}
.h2{margin:0;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#C9D1EE}
.lbl{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8C97B8}
.muted{color:#8C97B8}
.gold{color:#FFC93C}.coral{color:#FF6A3D}.aqua{color:#2FE0D0}
.btn{border:0;font:inherit;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:15px 26px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px)}
.btn.pri{background:linear-gradient(180deg,#FFD866,#FFB21E);color:#1A1200;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.sec{background:#1B2648;color:#F2F5FF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.sm{padding:9px 16px;font-size:12px}
.nav{border:0;background:transparent;color:#AEB7D6;font:inherit;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:10px 16px;cursor:pointer;position:relative}
.nav.on{color:#FFC93C}
.nav.on::after{content:"";position:absolute;left:16px;right:16px;bottom:2px;height:3px;background:#FFC93C;box-shadow:0 0 12px #FFC93C}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.07);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.tag.g{background:rgba(255,201,60,.16);color:#FFC93C}.tag.c{background:rgba(255,106,61,.16);color:#FF8A63}.tag.a{background:rgba(47,224,208,.14);color:#2FE0D0}
.meter{height:10px;background:#1A2444;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#FFB21E,#FFD866);box-shadow:0 0 12px rgba(255,201,60,.6)}
.meter.a i{background:linear-gradient(90deg,#1FC2B4,#2FE0D0)}
.ms{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;font-size:14px}
.ms b{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:#1A2444;font-size:12px;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.ms.done b{background:#2FE0D0;color:#04201D}
.lbr{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 12px;font-size:14px;background:rgba(255,255,255,.03)}
.lbr.me{background:linear-gradient(90deg,rgba(255,201,60,.18),transparent);box-shadow:inset 3px 0 0 #FFC93C}
.world{text-align:left;border:0;color:inherit;font:inherit;cursor:pointer;padding:26px;display:flex;flex-direction:column;gap:16px;min-height:220px;transition:transform .25s cubic-bezier(.16,1,.3,1)}
.world:hover{transform:translateY(-4px)}
.node{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-family:'Russo One',sans-serif;font-size:22px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex:none}
.node.passed{background:#2FE0D0;color:#04201D}.node.ticket{background:#FFC93C;color:#1A1200;filter:drop-shadow(0 0 14px rgba(255,201,60,.8))}.node.progress{background:#3A4C8A}.node.new{background:#FF6A3D;color:#1A0700}.node.locked{background:#1A2444;color:#4B5778}
.st{font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8C97B8}
.st.passed{color:#2FE0D0}.st.ticket{color:#FFC93C}.st.new{color:#FF8A63}.st.progress{color:#A9B7F0}
.step{border:0;background:transparent;color:#8C97B8;font:inherit;font-weight:600;font-size:14px;cursor:pointer;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.step b{font-family:'Russo One',sans-serif;font-weight:400;font-size:18px}
.step.on{color:#F2F5FF;background:linear-gradient(90deg,rgba(255,201,60,.16),transparent);box-shadow:inset 3px 0 0 #FFC93C}
.step.on b{color:#FFC93C}
.lb{display:grid;grid-template-columns:48px 1fr auto auto;gap:14px;align-items:center;padding:14px 16px;background:rgba(255,255,255,.03)}
.lb.Ongoing{opacity:.5}
.av{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-family:'Russo One',sans-serif;font-size:16px;background:#1F2C55;color:#FFC93C;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex:none}
.seg{flex:1;height:20px;transform:skewX(-18deg);background:#1A2444;transition:background .3s,box-shadow .3s}
.seg.met{background:linear-gradient(180deg,#FFD866,#FFB21E);box-shadow:0 0 14px rgba(255,201,60,.6)}
.seg.now{background:#5A4520}
.tab{border:0;font:inherit;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;background:transparent;color:#8C97B8;cursor:pointer}
.tab.on{color:#1A1200;background:#FFC93C}
.ln{display:grid;grid-template-columns:56px 80px 1fr;gap:12px;font-size:14px;line-height:1.55;padding:6px 0}
.ln.a .who{color:#FFC93C}.ln.d .who{color:#2FE0D0}
.hl{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:rgba(255,255,255,.03);font-size:14px}
.tb{flex:1;background:#1F2C55;clip-path:polygon(0 6px,6px 0,100% 0,100% 100%,0 100%)}
.tb.on{background:linear-gradient(180deg,#FFD866,#FF6A3D);filter:drop-shadow(0 0 12px rgba(255,170,60,.5))}
.hs{display:grid;grid-template-columns:1fr 120px 60px;gap:12px;align-items:center;padding:13px 16px;background:rgba(255,255,255,.03);font-size:14px}
.hs .sc{font-family:'Russo One',sans-serif;font-size:18px;text-align:right}
.hs.pass .sc{color:#2FE0D0}.hs.miss .sc{color:#FF8A63}
.badge{width:76px;height:76px;display:flex;align-items:center;justify-content:center;font-family:'Russo One',sans-serif;font-size:24px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
@keyframes enter{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes slamL{from{transform:translateX(-130%)}to{transform:none}}
@keyframes slamR{from{transform:translateX(130%)}to{transform:none}}
@keyframes zoom{0%{transform:scale(2.6);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
@keyframes pulseg{0%,100%{filter:drop-shadow(0 0 10px rgba(255,201,60,.45))}50%{filter:drop-shadow(0 0 26px rgba(255,201,60,.9))}}
@keyframes eq{0%,100%{transform:scaleY(.15)}50%{transform:scaleY(1)}}
@keyframes combo{0%{transform:translateY(24px) scale(.6);opacity:0}18%{transform:none;opacity:1}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes sweep{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.enter{animation:enter .45s ease-out both}
.slamL{animation:slamL .6s cubic-bezier(.2,1.25,.4,1) both}.slamR{animation:slamR .6s cubic-bezier(.2,1.25,.4,1) both}
.zoom{animation:zoom .55s cubic-bezier(.2,1.2,.4,1) both}
.pulseg{animation:pulseg 1.6s ease-in-out infinite}
.eq{transform-origin:bottom;animation:eq .7s ease-in-out infinite}
.combo{animation:combo 1.5s ease-out both}
.sweep{animation:sweep 8s ease-in-out infinite}
.fill{transform-origin:left;animation:fill .9s cubic-bezier(.2,1,.4,1) both}
.rise{transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1,.4,1) both}
.slide{animation:slide .4s ease-out both}
.shine{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@media (prefers-reduced-motion:reduce){.enter,.slamL,.slamR,.zoom,.pulseg,.eq,.combo,.sweep,.fill,.rise,.slide,.shine{animation:none}}
@media (max-width:760px){
.scr{padding:16px 16px 90px}
.row{display:flex;flex-direction:column;gap:16px}
.h1{font-size:32px}
.card{padding:20px}
.top{padding:12px 16px !important;flex-wrap:wrap}
.top nav{order:3;width:100%;overflow-x:auto}
.nav{padding:10px 10px;font-size:12px}
.lb{grid-template-columns:44px 1fr auto}.lb .hide-m{display:none}
.hs{grid-template-columns:1fr 50px}.hs .hide-m{display:none}
.ln{grid-template-columns:46px 1fr}.ln .who{display:none}
.vs{flex-direction:column !important;gap:10px !important}
.vs .pc{width:100% !important;height:180px !important}
.vs .amp{margin:-30px 0 !important;width:64px !important;height:64px !important;font-size:26px !important}
.hud{grid-template-columns:1fr 84px 1fr !important;gap:10px !important}
.hud .timer{height:64px !important}.hud .timer span{font-size:24px !important}
.sub{font-size:26px !important}
.track{overflow-x:auto}
.worlds{grid-template-columns:1fr !important}
.bigscore{font-size:64px !important}
.clear{font-size:56px !important}
}
</style>
<link rel="stylesheet" href="../mobile.css">
<style>
.dc-switch{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(15,18,20,.82);backdrop-filter:blur(12px);font:600 12px/1 system-ui,sans-serif}
.dc-switch a{color:#E8ECEA;text-decoration:none;padding:8px 12px;border-radius:99px}
.dc-switch a:hover{background:rgba(255,255,255,.12)}
.dc-switch a[aria-current]{background:#E8ECEA;color:#111}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl"><div class="gs">
  <div class="dots" aria-hidden="true"></div>
  <div class="beam sweep" aria-hidden="true" style="left: 14%; background: linear-gradient(180deg, rgba(255,201,60,.14), transparent 70%)"></div>
  <div class="beam sweep" aria-hidden="true" style="right: 14%; background: linear-gradient(180deg, rgba(47,224,208,.12), transparent 70%); animation-delay: -4s"></div>

  <header class="top" style="position: relative; padding: 16px 40px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(7,12,28,.6); backdrop-filter: blur(10px)">
    <div style="display: flex; align-items: center; gap: 12px">
      <div class="badge" style="width: 40px; height: 40px; font-size: 16px; background: linear-gradient(180deg, #FFD866, #FFB21E); color: #1A1200">N</div>
      <span class="disp" style="font-size: 22px; letter-spacing: .04em">NEGO<span class="gold">!</span></span>
    </div>
    <nav aria-label="Main" style="display: flex; gap: 4px"><sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><button class="{{n.cls}}" onClick="{{n.go}}">{{n.t}}</button></sc-for></nav>
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FF6A3D" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-8z"></path></svg>{{streak}}</span>
      <div style="display: flex; flex-direction: column; gap: 4px; width: 130px"><div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .1em"><span>LV 7</span><span class="muted">{{xpShort}}</span></div><div class="meter a"><i style="width: {{xp}}; transition: width 1s"></i></div></div>
    </div>
  </header>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="scr enter">
      <div class="row">
        <section class="pnl glow card c8" style="padding: 34px; gap: 18px; overflow: hidden">
          <div class="shine" aria-hidden="true"></div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap"><span class="tag g">Featured round</span><span class="tag c">TL pick · coaching ticket</span></div>
          <h1 class="h1" style="font-size: 58px; max-width: 13ch">{{scriptTitle}}</h1>
          <p style="margin: 0; font-size: 16px; max-width: 54ch; color: #C9D1EE">{{scriptScenario}}</p>
          <div style="display: flex; gap: 22px; flex-wrap: wrap; align-items: center"><span class="gold" style="font-size: 18px; letter-spacing: .2em">★★★☆☆</span><span class="lbl">{{bankName}}</span><span class="tag a">+120 XP</span></div>
          <div style="display: flex; gap: 10px; flex-wrap: wrap"><button class="btn pri" onClick="{{goHub}}">Play round</button><button class="btn sec" onClick="{{readCurrent}}">Study playbook</button></div>
        </section>
        <div class="c4" style="display: flex; flex-direction: column; gap: 20px">
          <section class="pnl card">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h2">Daily challenges</h2><span class="lbl">{{missionsDone}}/3</span></div>
            <sc-for list="{{missions}}" as="m" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 6px"><div class="{{m.cls}}"><b>{{m.mark}}</b><span>{{m.t}}</span><span class="muted" style="font-size: 12px; font-weight: 700">{{m.p}}</span></div><div class="meter" style="margin-left: 40px"><i class="fill" style="width: {{m.w}}"></i></div></div></sc-for>
          </section>
          <section class="pnl card">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h2">MC 7 leaderboard</h2><span class="lbl">This week</span></div>
            <div style="display: flex; flex-direction: column; gap: 4px"><sc-for list="{{board}}" as="b" hint-placeholder-count="4"><div class="{{b.cls}}"><span class="disp" style="font-size: 16px; color: #8C97B8">{{b.r}}</span><span style="font-weight: 600">{{b.n}}</span><span class="disp gold" style="font-size: 15px">{{b.s}}</span></div></sc-for></div>
          </section>
        </div>
      </div>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h2">Next rounds · {{bankName}}</h2><button class="btn sec sm" onClick="{{goBook}}">See all</button></div>
        <div class="row"><sc-for list="{{upNext}}" as="x" hint-placeholder-count="3"><button class="pnl world c4 slide" onClick="{{x.read}}" style="min-height: 150px; animation-delay: {{x.d}}"><div style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span class="{{x.cls}}">{{x.label}}</span><span class="gold" style="letter-spacing: .15em">{{x.stars}}</span></div><span class="disp" style="font-size: 22px; line-height: 1.15">{{x.t}}</span><span class="muted" style="font-size: 13px">{{x.min}} min · {{x.xp}}</span></button></sc-for></div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{isBooks}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap"><div style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">Playbooks</span><h1 class="h1">Pick a bank</h1></div><span class="tag a">{{totalDone}} of 22 rounds cleared</span></div>
      <div class="row worlds" style="grid-template-columns: repeat(2, minmax(0, 1fr))">
        <sc-for list="{{banks}}" as="b" hint-placeholder-count="4">
          <button class="pnl world slide" onClick="{{b.open}}" style="animation-delay: {{b.d}}; background: linear-gradient(135deg, {{b.tint}}, #0D142C 60%)">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 12px"><div style="display: flex; flex-direction: column; gap: 6px"><span class="lbl" style="color: {{b.c}}">{{b.note}}</span><span class="disp" style="font-size: 30px; line-height: 1.05">{{b.name}}</span></div><div class="badge" style="background: {{b.c}}; color: #0A0F22">{{b.label}}</div></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; width: 100%"><span class="muted">TL {{b.tl}}</span><span>{{b.pct}} cleared</span></div>
            <div class="meter" style="width: 100%"><i class="fill" style="width: {{b.pct}}; background: {{b.c}}"></i></div>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isBook}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap"><div style="display: flex; flex-direction: column; gap: 8px"><button class="btn sec sm" onClick="{{goBooks}}" style="align-self: flex-start">All banks</button><h1 class="h1">{{bankName}}</h1></div><span class="tag g">{{bankDone}} / {{bankTotal}} cleared</span></div>
      <section class="pnl card track" style="padding: 30px">
        <div style="display: flex; align-items: center; min-width: 560px">
          <sc-for list="{{scripts}}" as="x" hint-placeholder-count="5"><div style="display: flex; align-items: center; flex: {{x.flex}}"><button class="{{x.nodeCls}}" onClick="{{x.read}}" aria-label="{{x.t}}" style="border: 0; cursor: pointer">{{x.n}}</button><div style="flex: 1; height: 4px; margin: 0 6px; background: {{x.line}}"></div></div></sc-for>
        </div>
      </section>
      <div class="row">
        <sc-for list="{{scripts}}" as="x" hint-placeholder-count="5">
          <section class="pnl card c4 slide" style="animation-delay: {{x.d}}">
            <div style="display: flex; justify-content: space-between; align-items: center"><span class="{{x.cls}}">Round {{x.n}} · {{x.label}}</span><span class="gold" style="letter-spacing: .15em; font-size: 13px">{{x.stars}}</span></div>
            <span class="disp" style="font-size: 22px; line-height: 1.15">{{x.t}}</span>
            <span class="muted" style="font-size: 14px">{{x.sc}}</span>
            <sc-if value="{{x.unlocked}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 8px; margin-top: auto"><button class="btn sec sm" onClick="{{x.read}}">Study</button><button class="btn pri sm" onClick="{{x.practice}}">Play</button></div></sc-if>
            <sc-if value="{{x.locked}}" hint-placeholder-val="{{ false }}"><span class="lbl" style="margin-top: auto">Clear round 4 to unlock</span></sc-if>
          </section>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isScript}}" hint-placeholder-val="{{ false }}">
    <div class="scr enter">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap"><div style="display: flex; flex-direction: column; gap: 8px"><button class="btn sec sm" onClick="{{goBook}}" style="align-self: flex-start">{{bankName}}</button><h1 class="h1">{{scriptTitle}}</h1></div><button class="btn pri" onClick="{{goHub}}">Play this round</button></div>
      <div class="row">
        <nav class="pnl c4" aria-label="Script steps" style="padding: 10px; display: flex; flex-direction: column; gap: 2px; align-self: start"><sc-for list="{{steps}}" as="p" hint-placeholder-count="5"><button class="{{p.cls}}" onClick="{{p.pick}}"><b>{{p.n}}</b><span>{{p.t}}</span></button></sc-for></nav>
        <section class="pnl glow card c8 enter" style="padding: 34px; gap: 18px">

    const scriptRows = this.SCRIPTS.map((x, i) => { const st = passed && x.id === 'app' ? 'passed' : x.status; return { ...x, n: i + 1, label: labels[st], cls: 'st ' + st, nodeCls: 'node ' + st, flex: i === 4 ? '0 0 auto' : '1', line: i === 4 ? 'transparent' : (st === 'passed' ? '#2FE0D0' : '#1F2C55'), locked: st === 'locked', unlocked: st !== 'locked', d: (i * 0.06) + 's', read: () => this.go('script', { script: x.id, step: 0 }), practice: () => this.go('hub', { script: x.id }) }; });
    const eqH = Array.from({ length: 64 }, (_, i) => 14 + Math.round(Math.abs(Math.sin(i * 0.7) * Math.cos(i * 0.23)) * 86));
    const missions = [ { t: 'Study a playbook', p: '1/1', w: '100%', done: true }, { t: 'Clear a duo round', p: passed ? '1/1' : '0/1', w: passed ? '100%' : '0%', done: passed }, { t: 'Hit all 5 points', p: passed ? '5/5' : '3/5', w: passed ? '100%' : '60%', done: passed } ];
    const hist = (passed ? [{ t: script.t, d: 'Today', s: 84, with: solo ? 'Solo' : 'Jomar D.' }] : []).concat(this.HISTORY).map(h => ({ ...h, cls: 'hs ' + (h.s >= 80 ? 'pass' : 'miss'), res: h.s >= 80 ? 'Cleared' : 'Below 80' }));
    return {
      isHome: scr === 'home', isBooks: scr === 'books', isBook: scr === 'book', isScript: scr === 'script', isHub: scr === 'hub',
      isLobby: scr === 'lobby', isLive: scr === 'live', isResults: scr === 'results', isProgress: scr === 'progress',
      nav: [['home', 'Home'], ['books', 'Playbooks'], ['hub', 'Play'], ['progress', 'Stats']].map(([id, label]) => ({ t: label, cls: 'nav' + (sect === id ? ' on' : ''), go: () => this.go(id) })),
      goHome: () => this.go('home'), goBooks: () => this.go('books'), goBook: () => this.go('book'), goHub: () => this.go('hub'),
      goProgress: () => this.go('progress'), goLive: () => this.go('live'), goResults: () => this.go('results'),
      readCurrent: () => this.go('script', { step: 0 }), createLobby: () => this.go('lobby', { mode: 'duo' }), goSolo: () => this.go('live', { mode: 'solo' }),
      nextStep: () => this.setState({ step: Math.min(4, stepI + 1) }), prevStep: () => this.setState({ step: Math.max(0, stepI - 1) }),
      tabSummary: () => this.setState({ tab: 'summary' }), tabTranscript: () => this.setState({ tab: 'transcript' }),
      isSummary: s.tab === 'summary', isTranscript: s.tab === 'transcript',
      tabSummaryCls: 'tab' + (s.tab === 'summary' ? ' on' : ''), tabTranscriptCls: 'tab' + (s.tab === 'transcript' ? ' on' : ''),
      streak: passed ? 6 : 5, xp: passed ? '86%' : '62%', xpShort: passed ? '1,290 XP' : '930 XP',
      bankName: bank.name, bankDone: bdone, bankTotal: bank.total, totalDone: 1 + (passed ? 1 : 0),
      scriptTitle: script.t, scriptScenario: script.sc,
      missions: missions.map(m => ({ ...m, cls: 'ms' + (m.done ? ' done' : ''), mark: m.done ? '✓' : '' })), missionsDone: missions.filter(m => m.done).length,
      board: [ { r: 1, n: 'Joy Santiago', s: '2,140', me: false }, { r: 2, n: 'Rica Manalo (you)', s: passed ? '1,980' : '1,860', me: true }, { r: 3, n: 'Paolo Reyes', s: '1,720', me: false }, { r: 4, n: 'Ana Lopez', s: '1,610', me: false } ].map(b => ({ ...b, cls: 'lbr' + (b.me ? ' me' : '') })),
      upNext: scriptRows.filter(x => x.unlocked && x.label !== 'Cleared' && x.id !== s.script).slice(0, 3),
      banks: this.BANKS.map((b, i) => { const d = b.done + (passed && b.id === 'amihan' ? 1 : 0); return { ...b, label: d + '/' + b.total, pct: Math.round(d / b.total * 100) + '%', d: (i * 0.07) + 's', open: () => this.go('book', { bank: b.id }) }; }),
      scripts: scriptRows,
      steps: this.STEPS.map((p, i) => ({ n: i + 1, t: p.t, cls: 'step' + (i === stepI ? ' on' : ''), pick: () => this.setState({ step: i }) })),
      stepN: stepI + 1, stepT: step.t, stepAgent: step.agent, stepCue: step.cue, stepReq: step.req,
      lobbies: this.LOBBIES.map(l => ({ ...l, cls: 'lb ' + l.state, open: l.state === 'Open', busy: l.state !== 'Open', join: () => this.go('lobby', { mode: 'duo' }) })),
      lobbyCount: this.LOBBIES.filter(l => l.state === 'Open').length,
      brief: 'promised ₱12,000 on 25 Oct. Lost a sideline job last week. Will ask to move the date. Accepts a split if offered.',
      ready: s.ready, notReady: !s.ready,
      pts, metCount, commit: (metCount * 20) + '%', debtorName: solo ? 'Recorded' : 'Jomar',
      hasCombo: !!recent, comboText: recent ? recent.req.toUpperCase() : '',
      nowLabel: cur ? 'Now: ' + cur.t : 'All points hit',
      debtorLine: lastD ? (solo ? 'Recorded: ' : 'Jomar: ') + lastD.text : 'Jomar is listening',
      said: words.slice(0, n).join(' '), rest: words.slice(n).join(' '), clock: fmt(t * 16),
      eq: eqH.map((h, i) => ({ h: h + '%', d: (i * 0.03) + 's', c: i % 3 === 0 ? '#FF6A3D' : i % 3 === 1 ? '#FFC93C' : '#2FE0D0' })),
      score: s.score, done: s.score >= 84, grade: s.score >= 84 ? 'A' : s.score >= 70 ? 'B' : 'C',
      rewards: [ { t: '+120 XP', cls: 'tag a', d: '.1s' }, { t: 'Streak 6', cls: 'tag c', d: '.25s' }, { t: 'Ticket closed', cls: 'tag g', d: '.4s' } ],
      crit: [ { t: 'Script accuracy', v: '44/50', w: '88%', d: '.1s' }, { t: 'Voice and tone', v: '24/30', w: '80%', d: '.3s' }, { t: 'Negotiation', v: '16/20', w: '80%', d: '.5s' } ],
      metrics: [ { t: 'Pace', v: '128 wpm', note: 'Good pace' }, { t: 'Filler words', v: '5%', note: 'Low' }, { t: 'Talk time', v: '58%', note: 'Balanced' } ],
      moments: this.STEPS.map((p, i) => ({ time: fmt(p.at * 16), t: p.req, q: '"' + p.agent.split(' ').slice(0, 6).join(' ') + '..."', tag: i === 3 ? 'Late' : 'Hit', tagCls: 'st ' + (i === 3 ? 'ticket' : 'passed'), d: (i * 0.07) + 's' })),
      transcript: this.LINES.map(l => ({ ts: fmt(l.at * 16), who: l.who === 'a' ? 'Rica' : (solo ? 'Recorded' : 'Jomar'), cls: 'ln ' + l.who, text: l.text })),
      history: hist,
      trend: this.TREND.map((v, i) => { const x = i === 5 && passed ? 82 : v; return { w: 'W' + (i + 1), v: x, h: x + '%', cls: 'tb' + (i === 5 ? ' on' : ''), d: (i * 0.07) + 's' }; }),
      skills: this.SKILLS.map((k, i) => { const v = k.t === 'Offering options' && passed ? 66 : k.v; return { t: k.t, v, w: v + '%', d: (i * 0.1) + 's' }; }),
      badges: [ { t: 'First clear', i: '1', c: '#2FE0D0', o: 1 }, { t: '5 day streak', i: '5', c: '#FF6A3D', o: 1 }, { t: 'Perfect 5', i: '★', c: '#FFC93C', o: passed ? 1 : 0.35 } ]
    };
  }
}
